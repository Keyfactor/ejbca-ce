<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<h:body>
    <ui:composition>
        <h3>
            <h:outputText value="#{web.text.PUBLISHERQUEUESTATUS}"/>
            <h:outputText
                    value="#{web.ejbcaWebBean.getHelpReference('/CA_Operations_Guide.html#Publisher%20Queue%20Status')}"
                    escape="false"/>
        </h3>
        <h:panelGroup
                rendered="#{ejbcawebbean.adminPreference.frontpagePublisherQueueStatus and adminIndexMBean.authorizedToViewPublishers}">
            <h:form>

                <p:dataTable value="#{ejbcawebbean.authorizedPublisherNames}"
                             var="publisherName"
                             styleClass="grid table-layout-auto vertical-padding-1"
                             stripedRows="true"
                             showGridlines="true"
                             rows="#{ejbcawebbean.adminPreference.entriesPerPage}"
                             paginator="true"
                             paginatorPosition="bottom"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} Publishers"
                             rowsPerPageTemplate="10,20,50,100,{ShowAll|'All'}"
                             pageLinks="3">
                    <p:column styleClass="table-title-column">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.PUBLISHER}"/>
                        </f:facet>
                        <h:outputText value="#{publisherName}"/>
                    </p:column>
                    <p:column styleClass="text-align-center">
                        <f:facet name="header">
                            <h:outputText title="#{web.text.QUEUELENGTH}" value="#{web.text.QUEUELENGTH_ABBR}"/>
                        </f:facet>
                        <h:outputText value="#{adminIndexMBean.getPublisherQueueLength(publisherName)}"/>
                    </p:column>
                    <p:column styleClass="text-align-center custom-padding">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.ACTIONS}"/>
                        </f:facet>
                        <div class="action-buttons">
                            <h:commandButton value="#{web.text.VIEW}" ajax="false"
                                             action="#{adminIndexMBean.getPublisherQueueInspectionLink(publisherName)}"
                                             icon="pi pi-file-search" styleClass="rounded-button"/>
                        </div>
                    </p:column>
                </p:dataTable>
            </h:form>
        </h:panelGroup>
        <h:panelGroup rendered="#{!ejbcawebbean.adminPreference.frontpagePublisherQueueStatus}">
            <h:outputText value="#{web.text.CANBEENABLED}"/>
        </h:panelGroup>
    </ui:composition>
</h:body>
</html>
