      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<h:body>
    <ui:composition>
        <ui:param name="resourceBean" value="#{adminIndexMBean}"/>

        <h3>
            <h:outputText value="#{web.text.CAHEALTH}"/>
            <h:outputText value="#{web.ejbcaWebBean.getHelpReference('/CA_Operations_Guide.html#CA%20Status')}"
                          escape="false"/>
        </h3>
        <h:panelGroup rendered="#{ejbcawebbean.adminPreference.frontpageCaStatus and adminMenuBean.authorizedToViewCA}">
            <h:form>
                <p:dataTable value="#{adminIndexMBean.caCrlStatusModel}"
                             var="caCrlStatusInfo"
                             lazy="true"
                             styleClass="grid table-layout-auto vertical-padding-1"
                             stripedRows="true"
                             showGridlines="true"
                             rows="#{ejbcawebbean.adminPreference.entriesPerPage}"
                             paginator="true"
                             paginatorPosition="bottom"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} CAs"
                             rowsPerPageTemplate="10,20,50,100,{ShowAll|'All'}"
                             pageLinks="3">
                    <p:column styleClass="table-title-column">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.CANAME}"/>
                        </f:facet>
                        <h:outputText value="#{caCrlStatusInfo.caName}"/>
                    </p:column>
                    <p:column styleClass="text-align-center">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.CASERVICE}"/>
                        </f:facet>
                        <h:graphicImage rendered="#{caCrlStatusInfo.caService}"
                                        url="#{ejbcawebbean.getImagePath('status-ca-active.png')}"
                                        alt="#{web.text.CASERVICE_ON}" title="#{web.text.CASERVICE_ON_TITLE}"/>
                        <h:graphicImage rendered="#{!caCrlStatusInfo.caService}"
                                        url="#{ejbcawebbean.getImagePath('status-ca-offline.png')}"
                                        alt="#{web.text.CASERVICE_OFF}" title="#{web.text.CASERVICE_OFF_TITLE}"/>
                    </p:column>
                    <p:column styleClass="text-align-center">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.CRLSTATUS}"/>
                        </f:facet>
                        <h:graphicImage rendered="#{caCrlStatusInfo.crlStatus}"
                                        url="#{ejbcawebbean.getImagePath('status-crl-uptodate.png')}"
                                        alt="#{web.text.CRLSTATUS_ON}" title="#{web.text.CRLSTATUS_ON_TITLE}"/>
                        <h:graphicImage rendered="#{!caCrlStatusInfo.crlStatus}"
                                        url="#{ejbcawebbean.getImagePath('status-crl-expired.png')}"
                                        alt="#{web.text.CRLSTATUS_OFF}" title="#{web.text.CRLSTATUS_OFF_TITLE}"/>
                    </p:column>
                </p:dataTable>
            </h:form>
        </h:panelGroup>
        <h:panelGroup rendered="#{!ejbcawebbean.adminPreference.frontpageCaStatus}">
            <h:outputText value="#{web.text.CANBEENABLED}"/>
        </h:panelGroup>
    </ui:composition>
</h:body>
</html>
