<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/include/template.xhtml">
    <ui:param name="resourceBean" value="#{ocspResponderMBean}"/>
    <ui:define name="content">

        <h1>
            <h:outputText value="#{web.text.INTERNALKEYBINDING_TYPE_OCSP}"/>
            <h:outputText value="#{web.ejbcaWebBean.getHelpReference('/OCSP_Responders.html')}" escape="false"/>
        </h1>

        <h:panelGroup>
            <div class="action-buttons">
                <h:form rendered="#{ocspResponderMBean.switchToEditAllowed or ocspResponderMBean.switchToViewAllowed}">
                    <h:commandButton rendered="#{ocspResponderMBean.switchToEditAllowed}"
                                     action="#{ocspResponderMBean.switchToEdit}"
                                     value="#{web.text.EDIT}" title="#{web.text.SWITCHTOEDITMODE}" update="@all"
                                     immediate="true"
                                     styleClass="padding-bottom-1-rem" />
                    <h:commandButton rendered="#{ocspResponderMBean.switchToViewAllowed}"
                                     action="#{ocspResponderMBean.switchToView}"
                                     value="#{web.text.VIEW}" title="#{web.text.SWITCHTOVIEWMODE}" update="@all"
                                     immediate="true"
                                     styleClass="padding-bottom-1-rem" />
                </h:form>
            </div>
        </h:panelGroup>

        <p:divider/>

        <h:form id="internalkeybinding">
            <p:panelGrid columns="2" columnClasses="ui-md-3,ui-md-3">
                <!-- OCSP Responder ID -->
                <p:row>
                    <p:column>
                        <h:outputLabel for="internalKeyBindingId" value="#{web.text.INTERNALKEYBINDING_FIELD_ID}"/>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="internalKeyBindingId">
                            <h:outputText rendered="#{ocspResponderMBean.currentInternalKeyBindingId ne '0'}"
                                          value="#{ocspResponderMBean.currentInternalKeyBindingId}"/>
                            <h:outputText rendered="#{ocspResponderMBean.currentInternalKeyBindingId eq '0'}"
                                          value="#{web.text.INTERNALKEYBINDING_NOTYETGENERATED}"/>
                        </h:panelGroup>
                        <h:message for="internalKeyBindingId"/>
                    </p:column>
                </p:row>

                <!-- Name -->
                <p:row>
                    <p:column>
                        <h:outputLabel for="name" value="#{web.text.INTERNALKEYBINDING_FIELD_NAME}"/>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="name">
                            <h:inputText rendered="#{ocspResponderMBean.inEditMode}"
                                         value="#{ocspResponderMBean.currentName}" title="#{web.text.FORMAT_ID_STR}"
                                         maxlength="255" class="ui-md-12"/>
                            <h:outputText rendered="#{!ocspResponderMBean.inEditMode}"
                                          value="#{ocspResponderMBean.currentName}"/>
                        </h:panelGroup>
                        <h:message for="name"/>
                    </p:column>
                </p:row>

                <!-- Crypto Token -->
                <p:row>
                    <p:column>
                        <h:outputLabel for="cryptoToken" value="#{web.text.INTERNALKEYBINDING_FIELD_CRYPTOTOKEN}"/>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="cryptoToken">
                            <h:panelGroup
                                    rendered="#{ocspResponderMBean.inEditMode and ocspResponderMBean.cryptoTokenActive}">
                                <h:selectOneMenu value="#{ocspResponderMBean.currentCryptoToken}"
                                                 onchange="document.getElementById('internalkeybinding:reloadCryptoToken').click();"
                                                 class="ui-md-12">
                                    <f:selectItems value="#{ocspResponderMBean.availableCryptoTokens}"/>
                                </h:selectOneMenu>
                                <h:commandButton id="reloadCryptoToken"
                                                 value="#{web.text.INTERNALKEYBINDING_CRYPTOTOKEN_UPDATENEXT}"
                                                 action="#{ocspResponderMBean.reloadCryptoToken}"/>
                                <script>document.getElementById('internalkeybinding:reloadCryptoToken').style.display = 'none';</script>
                            </h:panelGroup>
                            <h:outputText
                                    rendered="#{ocspResponderMBean.inEditMode and !ocspResponderMBean.cryptoTokenActive and ocspResponderMBean.currentCryptoTokenName != null}"
                                    value=" #{web.text.INTERNALKEYBINDING_CRYPTOTOKEN_NOTACTIVE}"/>
                            <h:outputText
                                    rendered="#{!ocspResponderMBean.inEditMode or !ocspResponderMBean.cryptoTokenActive}"
                                    value="#{ocspResponderMBean.currentCryptoTokenName != null ? ocspResponderMBean.currentCryptoTokenName : web.text.INTERNALKEYBINDING_CRYPTOTOKEN_MISSING}"
                                    title="#{ocspResponderMBean.currentCryptoToken}"/>
                        </h:panelGroup>
                        <h:message for="cryptoToken"/>
                    </p:column>
                </p:row>

                <!-- Key Pair Alias -->
                <p:row>
                    <p:column>
                        <h:outputLabel for="keyPairAlias" value="#{web.text.INTERNALKEYBINDING_FIELD_KEYPAIRALIAS}"/>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="keyPairAlias">
                            <h:panelGroup
                                    rendered="#{ocspResponderMBean.inEditMode and ocspResponderMBean.cryptoTokenActive and !ocspResponderMBean.boundToCertificate}">
                                <h:selectOneMenu value="#{ocspResponderMBean.currentKeyPairAlias}"
                                                 onchange="document.getElementById('internalkeybinding:reloadKeyPairAlias').click();"
                                                 class="ui-md-12">
                                    <f:selectItems value="#{ocspResponderMBean.availableKeyPairAliases}"/>
                                </h:selectOneMenu>
                                <h:commandButton id="reloadKeyPairAlias"
                                                 value="#{web.text.INTERNALKEYBINDING_KEYPAIRALIAS_UPDATE}"
                                                 action="#{ocspResponderMBean.reloadKeyPairAlias}"/>
                                <script>document.getElementById('internalkeybinding:reloadKeyPairAlias').style.display = 'none';</script>
                            </h:panelGroup>
                            <h:outputText
                                    rendered="#{!ocspResponderMBean.inEditMode or !ocspResponderMBean.cryptoTokenActive || ocspResponderMBean.boundToCertificate}"
                                    value="#{ocspResponderMBean.currentKeyPairAlias}"/>
                        </h:panelGroup>
                        <h:message for="keyPairAlias"/>
                    </p:column>
                </p:row>

                <!-- Signature algorithm -->
                <p:row>
                    <p:column>
                        <h:outputLabel for="signatureAlgorithm" value="#{web.text.INTERNALKEYBINDING_FIELD_SIGALG}"/>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="signatureAlgorithm">
                            <h:selectOneMenu
                                    rendered="#{ocspResponderMBean.inEditMode and ocspResponderMBean.cryptoTokenActive}"
                                    value="#{ocspResponderMBean.currentSignatureAlgorithm}" class="ui-md-12">
                                <f:selectItems value="#{ocspResponderMBean.availableSignatureAlgorithms}"/>
                            </h:selectOneMenu>
                            <h:panelGroup
                                    rendered="#{!ocspResponderMBean.inEditMode or !ocspResponderMBean.cryptoTokenActive}">
                                <h:outputText rendered="#{ocspResponderMBean.currentSignatureAlgorithm != null}"
                                              value="#{ocspResponderMBean.currentSignatureAlgorithm}"/>
                                <h:outputText rendered="#{ocspResponderMBean.currentSignatureAlgorithm == null}"
                                              value="#{web.text.INTERNALKEYBINDING_FIELD_NOTSPECIFIED} (error)"/>
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:message for="signatureAlgorithm"/>
                    </p:column>
                </p:row>

                <!-- Next key pair alias -->
                <p:row rendered="#{ocspResponderMBean.currentInternalKeyBindingId ne '0'}">
                    <p:column>
                        <h:outputLabel for="nextKeyPairAlias"
                                       value="#{web.text.INTERNALKEYBINDING_FIELD_NEXTKEYPAIRALIAS}"/>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="nextKeyPairAlias">
                            <h:panelGroup
                                    rendered="#{ocspResponderMBean.inEditMode and ocspResponderMBean.cryptoTokenActive}">
                                <h:selectOneMenu value="#{ocspResponderMBean.currentNextKeyPairAlias}" class="ui-md-12">
                                    <f:selectItem itemValue="" itemLabel="#{web.text.INTERNALKEYBINDING_FIELD_NONE}"/>
                                    <f:selectItems value="#{ocspResponderMBean.availableKeyPairAliases}"/>
                                </h:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup
                                    rendered="#{!ocspResponderMBean.inEditMode or !ocspResponderMBean.cryptoTokenActive}">
                                <h:outputText rendered="#{ocspResponderMBean.currentNextKeyPairAlias != null}"
                                              value="#{ocspResponderMBean.currentNextKeyPairAlias}"/>
                                <h:outputText rendered="#{ocspResponderMBean.currentNextKeyPairAlias == null}"
                                              value="#{web.text.INTERNALKEYBINDING_FIELD_NOTSPECIFIED}"/>
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:message for="nextKeyPairAlias"/>
                    </p:column>
                </p:row>

                <!-- Certificate ID -->
                <p:row rendered="#{ocspResponderMBean.boundToCertificate}">
                    <p:column>
                        <h:outputLabel for="certificateId" value="#{web.text.INTERNALKEYBINDING_FIELD_BOUNDCERT}"/>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="certificateId">
                            <h:outputLink target="_blank" rel="noopener"
                                          value="/ejbca/adminweb/viewcertificate.xhtml?certsernoparameter=#{ocspResponderMBean.boundCaCertificateSerialNumber},#{ocspResponderMBean.boundCaCertificateIssuerDn}&amp;ref=keybindings">
                                <f:param name="returnTo" value="4"/>
                                <f:param name="keyBindingId" value="#{ocspResponderMBean.currentInternalKeyBindingId}"/>
                                <h:outputText value="#{ocspResponderMBean.boundCertificateInternalCaName}"
                                              rendered="#{ocspResponderMBean.boundCertificateInternalCaName != null}"/>
                                <h:outputText value="#{ocspResponderMBean.boundCertificateIssuerDn}"
                                              rendered="#{ocspResponderMBean.boundCertificateInternalCaName == null}"/>
                            </h:outputLink>
                            <h:outputText value="  "/>
                            <h:outputLink target="_blank" rel="noopener"
                                          value="/ejbca/adminweb/viewcertificate.xhtml?certsernoparameter=#{ocspResponderMBean.boundCertificateSerialNumber},#{ocspResponderMBean.boundCertificateIssuerDn}&amp;ref=keybindings">
                                <f:param name="returnTo" value="4"/>
                                <f:param name="keyBindingId" value="#{ocspResponderMBean.currentInternalKeyBindingId}"/>
                                <h:outputText value="#{ocspResponderMBean.boundCertificateSerialNumber}"/>
                            </h:outputLink>
                        </h:panelGroup>
                        <h:message for="certificateId"/>
                    </p:column>
                </p:row>
            </p:panelGrid>

            <p:divider/>

            <!-- Request Signers section -->
            <h3 class="padding-bottom-1-rem">
                <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSP_TRUSTEDCERTIFICATES}"/>
            </h3>

            <h:outputText rendered="#{ocspResponderMBean.trustedCertificates.rowCount == 0}"
                          value="#{web.text.INTERNALKEYBINDING_OCSP_TRUSTINGANY}"/>

            <p:panelGrid columns="1" columnClasses="ui-md-6">
                <p:dataTable value="#{ocspResponderMBean.trustedCertificates}"
                             id="trustedCertificates"
                             var="trustEntry"
                             rendered="#{ocspResponderMBean.trustedCertificates.rowCount != 0 or ocspResponderMBean.inEditMode}"
                             styleClass="grid table-layout-auto vertical-padding-1"
                             stripedRows="true"
                             showGridlines="true"
                             emptyMessage=""
                >
                    <p:column styleClass="table-title-column">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.INTERNALKEYBINDING_CA}"/>
                        </f:facet>
                        <h:outputText value="#{ocspResponderMBean.trustedCertificatesCaName}"
                                      title="#{trustEntry.caId}"/>
                        <f:facet name="footer">
                            <h:selectOneMenu rendered="#{ocspResponderMBean.inEditMode}"
                                             value="#{ocspResponderMBean.currentCertificateAuthority}"
                                             class="ui-md-12"
                            >
                                <f:selectItems value="#{ocspResponderMBean.availableCertificateAuthorities}"/>
                            </h:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column styleClass="text-align-left">
                        <f:facet name="header"><h:outputText
                                value="#{web.text.INTERNALKEYBINDING_SERIALNUMER}"/></f:facet>
                        <h:outputText rendered="#{!empty trustEntry.certificateSerialNumberDecimal}"
                                      value="#{ocspResponderMBean.trustedCertificatesSerialNumberHex}"/>
                        <h:outputText rendered="#{empty trustEntry.certificateSerialNumberDecimal}" value="ANY"/>
                        <f:facet name="footer">
                            <h:inputText id="certificateSerialNumber" rendered="#{ocspResponderMBean.inEditMode}"
                                         required="false"
                                         value="#{ocspResponderMBean.currentCertificateSerialNumber}"
                                         class="ui-md-12"
                                         maxlength="255"
                                         title="#{web.text.INTERNALKEYBINDING_EMPTYFORANY}">
                                <f:validator validatorId="optionalHexSerialNumberValidator"/>
                            </h:inputText>
                            <h:message for="certificateSerialNumber" rendered="#{ocspResponderMBean.inEditMode}"/>
                        </f:facet>
                    </p:column>
                    <p:column styleClass="text-align-left">
                        <f:facet name="header"><h:outputText
                                value="#{web.text.INTERNALKEYBINDING_TRUSTENTRY_DESCRIPTION}"/></f:facet>
                        <h:outputText value="#{trustEntry.trustEntryDescription}"/>
                        <f:facet name="footer">
                            <h:inputText id="trustEntryDescription" rendered="#{ocspResponderMBean.inEditMode}"
                                         required="false"
                                         value="#{ocspResponderMBean.currentTrustEntryDescription}"
                                         class="ui-md-12"
                                         maxlength="255"
                                         title="#{web.text.INTERNALKEYBINDING_TRUSTENTRY_TITLE}">
                            </h:inputText>
                            <h:message for="trustEntryDescription" rendered="#{ocspResponderMBean.inEditMode}"/>
                        </f:facet>
                    </p:column>
                    <p:column rendered="#{ocspResponderMBean.inEditMode}">
                        <f:facet name="header"><h:outputText value="#{web.text.INTERNALKEYBINDING_ACTIONS}"/></f:facet>
                        <div class="action-buttons">
                            <h:commandButton id="deleteTrust" value="#{web.text.DELETE}" action="#{ocspResponderMBean.removeTrust}"/>
                            <f:facet name="footer">
                                <h:commandButton rendered="#{ocspResponderMBean.inEditMode}"
                                                 action="#{ocspResponderMBean.addTrust}"
                                                 value="#{web.text.ADD}"/>
                            </f:facet>
                        </div>
                    </p:column>
                </p:dataTable>
            </p:panelGrid>

            <p:divider/>

            <!-- Generate OCSP responses for -->
            <h3 class="padding-bottom-1-rem">
                <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_CERTIFICATE_GROUP}"/>
            </h3>

            <h:panelGroup rendered="#{not ocspResponderMBean.inEditMode}">
                <h:outputText rendered="#{ocspResponderMBean.signOcspResponseForCas.rowCount == 0}"
                              value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_RESPONSES_ONLY_SELF}"/>
            </h:panelGroup>

            <p:panelGrid columns="1" columnClasses="ui-md-6">
                <p:dataTable value="#{ocspResponderMBean.signOcspResponseForCas}"
                             id="signOcspResponseForCaList"
                             var="otherCa"
                             rendered="#{ocspResponderMBean.signOcspResponseForCas.rowCount != 0 or ocspResponderMBean.inEditMode}"
                             styleClass="grid table-layout-auto vertical-padding-1"
                             stripedRows="true"
                             showGridlines="true"
                             emptyMessage=""
                >
                    <p:column styleClass="table-title-column">
                        <f:facet name="header"><h:outputText value="#{web.text.INTERNALKEYBINDING_CA}"/></f:facet>
                        <h:outputText value="#{ocspResponderMBean.signOcspResponseForCasCaName}"
                                      title="#{otherCa.caId}"/>
                        <f:facet name="footer">
                            <h:selectOneMenu rendered="#{ocspResponderMBean.inEditMode}"
                                             value="#{ocspResponderMBean.currentCertificateAuthorityOcspRespToSign}"
                                             class="ui-md-12"
                            >
                                <f:selectItems
                                        value="#{ocspResponderMBean.availableCertificateAuthoritiesForOcspSign}"/>
                            </h:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column styleClass="text-align-left">
                        <f:facet name="header"><h:outputText
                                value="#{web.text.INTERNALKEYBINDING_TRUSTENTRY_DESCRIPTION}"/></f:facet>
                        <h:outputText value="#{otherCa.trustEntryDescription}"/>
                        <f:facet name="footer">
                            <h:inputText id="trustEntryDescriptionOcsp" rendered="#{ocspResponderMBean.inEditMode}"
                                         required="false"
                                         value="#{ocspResponderMBean.currentTrustEntryDescriptionOcspRespToSign}"
                                         class="ui-md-12" maxlength="255"
                                         title="#{web.text.INTERNALKEYBINDING_TRUSTENTRY_TITLE}">
                            </h:inputText>
                            <h:message for="trustEntryDescriptionOcsp" rendered="#{ocspResponderMBean.inEditMode}"/>
                        </f:facet>
                    </p:column>
                    <p:column rendered="#{ocspResponderMBean.inEditMode}">
                        <f:facet name="header"><h:outputText value="#{web.text.INTERNALKEYBINDING_ACTIONS}"/></f:facet>
                        <div class="action-buttons">
                            <h:commandButton id="deleteCaToSign" value="#{web.text.DELETE}"
                                             action="#{ocspResponderMBean.removeCaToSignOcspResponse}"/>
                            <f:facet name="footer">
                                <h:commandButton action="#{ocspResponderMBean.addCaToSignOcspResponse}"
                                                 value="#{web.text.ADD}"/>
                            </f:facet>
                        </div>
                    </p:column>
                </p:dataTable>
            </p:panelGrid>

            <p:divider/>

            <!-- Properties -->
            <h3 class="padding-bottom-1-rem">
                <h:outputText value="#{web.text.INTERNALKEYBINDING_PROPERTIES}"/>
            </h3>

            <p:dataTable value="#{ocspResponderMBean.internalKeyBindingPropertyList}" var="property"
                         styleClass="grid table-layout-auto vertical-padding-1 no-header no-border">
                <p:column>
                    <h:outputText value="#{ocspResponderMBean.propertyNameTranslated}"/>
                </p:column>
                <p:column>
                    <h:panelGroup rendered="#{!property.multiValued}">
                        <h:inputText disabled="#{!ocspResponderMBean.inEditMode}"
                                     rendered="#{property.type.simpleName eq 'String'}" value="#{property.value}" class="ui-md-12"/>
                        <h:inputText disabled="#{!ocspResponderMBean.inEditMode}"
                                     rendered="#{property.type.simpleName eq 'Long'}" value="#{property.value}" class="ui-md-12">
                            <f:converter converterId="jakarta.faces.Long"/>
                        </h:inputText>
                        <p:selectBooleanCheckbox disabled="#{!ocspResponderMBean.inEditMode}"
                                                 rendered="#{property.type.simpleName eq 'Boolean'}"
                                                 value="#{property.value}" />
                    </h:panelGroup>
                    <h:selectOneMenu disabled="#{!ocspResponderMBean.inEditMode}" rendered="#{property.multiValued}"
                                     value="#{property.encodedValue}" class="ui-md-12">
                        <f:selectItems value="#{ocspResponderMBean.propertyPossibleValues}"/>
                    </h:selectOneMenu>
                </p:column>
            </p:dataTable>
            <h:panelGroup rendered="#{ocspResponderMBean.internalKeyBindingPropertyList.rowCount == 0}">
                <div><h:outputText value="#{web.text.INTERNALKEYBINDING_NOPROPERTIES}"/></div>
            </h:panelGroup>

            <!-- These two properties are not part of internalKeyBindingPropertyList, thus having different styling -->
            <p:panelGrid columns="2" columnClasses="ui-md-3,ui-md-3" style="padding:1rem">
                <p:row>
                    <p:column>
                        <h:outputLabel for="chainGeneration" value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_CERTCHAIN_GENERATION}"/>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="chainGeneration">
                            <h:panelGroup
                                    disabled="#{!ocspResponderMBean.inEditMode or !ocspResponderMBean.boundToCertificate}">
                                <h:selectOneMenu value="#{ocspResponderMBean.currentCaGeneration}"
                                                 disabled="#{!ocspResponderMBean.inEditMode}" class="ui-md-12">
                                    <f:selectItems value="#{ocspResponderMBean.availableCertificateChains}"/>
                                </h:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:message for="chainGeneration"/>
                    </p:column>
                </p:row>
                <p:row>
                    <p:column>
                        <h:outputLabel for="responseForUnknown"
                                       value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_RESPONSE_FOR_UNKNOWN}"/>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="responseForUnknown">
                            <h:panelGroup disabled="#{!ocspResponderMBean.inEditMode}">
                                <h:selectOneMenu value="#{ocspResponderMBean.currentUnknownResponse}"
                                                 disabled="#{!ocspResponderMBean.inEditMode}" class="ui-md-12">
                                    <f:selectItems value="#{ocspResponderMBean.availableUnknownResponses}"/>
                                </h:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>
                    </p:column>
                </p:row>
            </p:panelGrid>

            <p:divider/>

            <!-- OCSP Extensions -->
            <h3 class="padding-bottom-1-rem">
                <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_OCSPEXTENSIONHEADER}"/>
            </h3>

            <p:panelGrid columns="1" columnClasses="ui-md-6">
                <p:dataTable value="#{ocspResponderMBean.ocspExtensions}"
                             id="ocspExtensions"
                             var="extensionEntry"
                             styleClass="grid table-layout-auto vertical-padding-1"
                             stripedRows="true"
                             showGridlines="true"
                             emptyMessage=""
                >
                    <p:column styleClass="table-title-column">
                        <f:facet name="header"><h:outputText
                                value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_OCSPEXTENSION_NAME}"/></f:facet>
                        <h:outputText value="#{ocspResponderMBean.ocspExtensionDisplayName}"/>
                        <f:facet name="footer">
                            <h:selectOneMenu rendered="#{ocspResponderMBean.inEditMode}"
                                             value="#{ocspResponderMBean.currentOcspExtension}">
                                <f:selectItems value="#{ocspResponderMBean.availableOcspExtensions}"/>
                            </h:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column styleClass="text-align-left">
                        <f:facet name="header"><h:outputText
                                value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_OCSPEXTENSION_OID}"/></f:facet>
                        <h:outputText value="#{ocspResponderMBean.ocspExtensionOid}"/>
                    </p:column>
                    <p:column rendered="#{ocspResponderMBean.inEditMode}">
                        <f:facet name="header"><h:outputText value="#{web.text.INTERNALKEYBINDING_ACTIONS}"/></f:facet>
                        <div class="action-buttons">
                            <h:commandButton value="#{web.text.DELETE}" action="#{ocspResponderMBean.removeOcspExtension}"
                                             rendered="#{ocspResponderMBean.inEditMode}"/>
                            <f:facet name="footer">
                                <h:commandButton rendered="#{ocspResponderMBean.inEditMode}"
                                                 action="#{ocspResponderMBean.addOcspExtension}"
                                                 value="#{web.text.ADD}"/>
                            </f:facet>
                        </div>
                    </p:column>
                </p:dataTable>
            </p:panelGrid>

            <p:divider/>

            <!-- Settings for OCSP Archive Cutoff Extension as specified in RFC6960 section 4.4.4. Only displayed for OCSP Key Bindings with an OCSP Archive Cutoff Extension added. -->
            <h3 class="padding-bottom-1-rem">
                <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_ARCHIVECUTOFFHEADER}"
                              rendered="#{ocspResponderMBean.ocspArchiveCutoffExtensionEnabled}"/>
                <h:outputText value="#{web.ejbcaWebBean.getHelpReference('/Archive_Cutoff.html')}" escape="false"
                              rendered="#{ocspResponderMBean.ocspArchiveCutoffExtensionEnabled}"/>
            </h3>

            <h:panelGrid columns="1" styleClass="ui-md-6" rendered="#{ocspResponderMBean.ocspArchiveCutoffExtensionEnabled}">
                <p:panelGrid id="retentionPeriodSettings"
                             columns="3"
                             columnClasses="ui-md-3,ui-md-3,ui-md-3"
                             rendered="#{ocspResponderMBean.ocspArchiveCutoffExtensionEnabled}">
                    <p:row>
                        <p:column>
                            <h:outputLabel value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_USEISSUERNOTBEFOREASARCHIVECUTOFF}"
                                           for="useIssuerNotBeforeAsArchiveCutoff"/>
                        </p:column>
                        <p:column>
                            <h:panelGroup>
                                <p:selectBooleanCheckbox id="useIssuerNotBeforeAsArchiveCutoff"
                                                         disabled="#{not ocspResponderMBean.inEditMode}"
                                                         value="#{ocspResponderMBean.useIssuerNotBeforeAsArchiveCutoff}">
                                    <f:ajax render="retentionPeriodSettings"/>
                                </p:selectBooleanCheckbox>
                            </h:panelGroup>
                        </p:column>
                        <p:column>
                            <h:panelGroup>
                                <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_USEISSUERNOTBEFOREASARCHIVECUTOFF_HELP}" styleClass="smallHelp"/>
                            </h:panelGroup>
                        </p:column>
                    </p:row>
                    <p:row rendered="#{ocspResponderMBean.ocspArchiveCutoffExtensionEnabled and !ocspResponderMBean.useIssuerNotBeforeAsArchiveCutoff}">
                        <p:column>
                            <h:outputLabel for="retentionPeriod"
                                           value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_RETENTIONPERIOD}" />
                        </p:column>
                        <p:column>
                            <h:inputText id="retentionPeriod" value="#{ocspResponderMBean.retentionPeriod}" styleClass="ui-md-11"
                                         disabled="#{not ocspResponderMBean.inEditMode}">
                                <f:validator validatorId="simpleTimeValidator"/>
                                <f:attribute name="precision" value="seconds"/>
                            </h:inputText>
                        </p:column>
                        <p:column>
                            <h:panelGroup>
                                <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_RETENTIONPERIOD_HELPTEXT}" styleClass="smallHelp"/>
                            </h:panelGroup>
                        </p:column>
                    </p:row>
                </p:panelGrid>
            </h:panelGrid>
            <p:divider rendered="#{ocspResponderMBean.ocspArchiveCutoffExtensionEnabled}"/>

            <div class="action-buttons">
                <h:commandButton value="#{web.text.SAVE}" action="#{ocspResponderMBean.createNew}"
                                 rendered="#{ocspResponderMBean.inEditMode and ocspResponderMBean.creatingNew}"/>
                <h:commandButton value="#{web.text.SAVE}" action="#{ocspResponderMBean.saveCurrent}"
                                 rendered="#{ocspResponderMBean.inEditMode and !ocspResponderMBean.creatingNew}"/>
                <h:button value="${web.text.CANCEL}" outcome="ocspresponders.xhtml"
                                 rendered="#{ocspResponderMBean.inEditMode}"/>
            </div>
        </h:form>
        <h:panelGroup>
            <div class="action-buttons">
                <h:button value="${web.text.CANCEL}" outcome="ocspresponders.xhtml"
                          rendered="#{!ocspResponderMBean.inEditMode}"/>
            </div>
        </h:panelGroup>

    </ui:define>
</ui:composition>
</html>
