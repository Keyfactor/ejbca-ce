	  xmlns:f="jakarta.faces.core"
	  xmlns:fn="jakarta.tags.functions"
	  xmlns:h="jakarta.faces.html"
	  xmlns:ui="jakarta.faces.facelets"
	  xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/include/template.xhtml">
	<ui:param name="resourceBean" value="#{ocspResponderMBean}" />
	<ui:define name="content">

	<h1>
		<h:outputText value="#{web.text.INTERNALKEYBINDING_TYPE_OCSP_RESPONDERS}"/>
		<h:outputText value="#{web.ejbcaWebBean.getHelpReference('/OCSP_Responders.html')}" escape="false"/>
	</h1>

    <p:tabView id="tabs" dynamic="true" activeIndex="#{ocspResponderMBean.lastActiveTab}">
        <p:ajax event="tabChange" listener="#{ocspResponderMBean.onTabChange}"/>

        <p:tab title="#{web.text.INTERNALKEYBINDING_TYPE_OCSP_RESPONDERS}">

		<h:outputText value="" rendered="#{ocspResponderMBean.pageLoadResetTrigger}"/>
		<h3 class="padding-bottom-1-rem">
			<h:outputText value="#{web.text.INTERNALKEYBINDING_TYPE_OCSP_LIST_OF_OCSPRESPONDERS}"/>
		</h3>
		<h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_DESCRIPTION}"/>

		<h:form id="internalkeybindings">
			<p:dataTable value="#{ocspResponderMBean.internalKeyBindingGuiList}" var="guiInfo" id="responderList"
						 styleClass="grid table-layout-auto vertical-padding-1"
						 stripedRows="true" showGridlines="true">
				<p:column styleClass="table-title-column">
					<f:facet name="header">
						<h:outputText value="#{web.text.INTERNALKEYBINDING_NAME}"/>
					</f:facet>
					<h:outputLink
							value="ocspresponder.xhtml?internalKeyBindingId=#{guiInfo.internalKeyBindingId}">
						<h:outputText value="#{guiInfo.name}" title="#{web.text.INTERNALKEYBINDING_VIEWWITH} #{guiInfo.internalKeyBindingId}"/>
					</h:outputLink>
				</p:column>

				<p:column styleClass="text-align-center">
					<f:facet name="header">
						<h:outputText value="#{web.text.INTERNALKEYBINDING_CERTIFICATEISSUER}"/>
					</f:facet>
					<h:outputLink value="/ejbca/adminweb/viewcertificate.xhtml" rendered="#{guiInfo.certificateBound}">
						<f:param name="certsernoparameter" value="#{guiInfo.caCertificateSerialNumber},#{fn:escapeXml(guiInfo.caCertificateIssuerDn)}"/>
						<f:param name="returnTo" value="2"/>
						<h:outputText value="#{guiInfo.certificateInternalCaName}" rendered="#{guiInfo.issuedByInternalCa}"/>
						<h:outputText value="#{guiInfo.certificateIssuerDn}" rendered="#{!guiInfo.issuedByInternalCa}"/>
					</h:outputLink>
					<h:outputText value="#{web.text.INTERNALKEYBINDING_NOT_PRESENT}" rendered="#{!guiInfo.certificateBound}"/>
				</p:column>

				<p:column styleClass="text-align-center">
					<f:facet name="header">
						<h:outputText value="#{web.text.INTERNALKEYBINDING_CERTIFICATESERIAL}"/>
					</f:facet>
					<h:outputLink value="/ejbca/adminweb/viewcertificate.xhtml" rendered="#{guiInfo.certificateBound}">
						<f:param name="certsernoparameter" value="#{guiInfo.certificateSerialNumber},#{fn:escapeXml(guiInfo.certificateIssuerDn)}"/>
						<f:param name="returnTo" value="#{ocspResponderMBean.selectedInternalKeyBindingType eq 'OcspKeyBinding' ? '2' : '3'}"/>
						<h:outputText value="#{guiInfo.certificateSerialNumber}"/>
					</h:outputLink>
					<h:outputText value="#{web.text.INTERNALKEYBINDING_NOT_PRESENT}" rendered="#{!guiInfo.certificateBound}"/>
				</p:column>
				<p:column styleClass="text-align-center">
					<f:facet name="header">
						<h:outputText value="#{web.text.INTERNALKEYBINDING_CRYPTOTOKEN}"/>
					</f:facet>
					<h:outputLink value="/ejbca/adminweb/cryptotoken/cryptotoken.xhtml?cryptoTokenId=#{guiInfo.cryptoTokenId}&amp;ref=ocspresponders">
						<h:outputText value="#{guiInfo.cryptoTokenName}" title="#{web.text.CRYPTOTOKEN_VIEWWITH} #{guiInfo.cryptoTokenId}"/>
					</h:outputLink>
				</p:column>
				<p:column styleClass="text-align-center">
					<f:facet name="header">
						<h:outputText value="#{web.text.INTERNALKEYBINDING_KEYPAIRALIAS}"/>
					</f:facet>
					<h:outputText value="#{guiInfo.keyPairAlias}"/>
				</p:column>
				<p:column styleClass="text-align-center">
					<f:facet name="header">
						<h:outputText value="#{web.text.INTERNALKEYBINDING_NEXTKEYPAIRALIAS}"/>
					</f:facet>
					<h:outputText rendered="#{guiInfo.nextKeyAliasAvailable}" value="#{guiInfo.nextKeyPairAlias}"/>
				</p:column>
				<p:column styleClass="text-align-center">
					<f:facet name="header">
						<h:outputText value="#{web.text.INTERNALKEYBINDING_STATUS}"/>
					</f:facet>
					<h:outputText value="#{web.text[guiInfo.status]}"/>
				</p:column>
				<p:column styleClass="text-align-center">
					<f:facet name="header">
						<h:outputText value="#{web.text.INTERNALKEYBINDING_OPERATIONAL_STATUS}"/>
					</f:facet>
					<h:graphicImage height="16" width="16" url="#{guiInfo.operationalStatus}" />
				</p:column>
				<p:column styleClass="text-align-left">
					<f:facet name="header">
						<h:outputText value="#{web.text.INTERNALKEYBINDING_ACTIONS}"/>
					</f:facet>
					<div class="action-buttons">
						<h:commandButton rendered="#{guiInfo.status ne 'INTERNALKEYBINDING_STATUS_DISABLED'}"
										 action="#{ocspResponderMBean.commandDisable}"
										 id="disable"
										 value="#{web.text.INTERNALKEYBINDING_DISABLE_SHORT}"
										 title="#{web.text.INTERNALKEYBINDING_DISABLE_FULL}"
										 disabled="#{ocspResponderMBean.forbiddenToEdit}"
										 ajax="false"
										 styleClass="rounded-button"
						/>
						<h:commandButton rendered="#{guiInfo.status eq 'INTERNALKEYBINDING_STATUS_DISABLED'}"
										 action="#{ocspResponderMBean.commandEnable}"
										 id="enable"
										 value="#{web.text.INTERNALKEYBINDING_ENABLE_SHORT}"
										 title="#{web.text.INTERNALKEYBINDING_ENABLE_FULL}"
										 disabled="#{ocspResponderMBean.forbiddenToEdit}"
										 ajax="false"
										 styleClass="rounded-button"
						/>
						<h:commandButton rendered="#{!guiInfo.nextKeyAliasAvailable and guiInfo.authorizedToGenerateKeys}"
										 action="#{ocspResponderMBean.commandGenerateNewKey}"
										 id="generateNewKeys"
										 value="#{web.text.INTERNALKEYBINDING_GENERATENEWKEY_SHORT}"
										 title="#{web.text.INTERNALKEYBINDING_GENERATENEWKEY_FULL}"
										 disabled="#{ocspResponderMBean.forbiddenToEdit}"
										 ajax="false"
										 styleClass="rounded-button"
						/>
						<h:commandButton rendered="#{guiInfo.authorizedToCryptoToken}"
										 action="#{ocspResponderMBean.commandGenerateRequest}"
										 id="csr"
										 value="#{web.text.INTERNALKEYBINDING_GETCSR_SHORT}"
										 title="#{web.text.INTERNALKEYBINDING_GETCSR_FULL}"
										 disabled="#{ocspResponderMBean.forbiddenToEdit}"
										 ajax="false"
										 styleClass="rounded-button"
						/>
						<h:commandButton action="#{ocspResponderMBean.commandReloadCertificate}"
										 id="reload"
										 value="#{web.text.INTERNALKEYBINDING_RELOADCERTIFICATE_SHORT}"
										 title="#{web.text.INTERNALKEYBINDING_RELOADCERTIFICATE_FULL}"
										 disabled="#{ocspResponderMBean.forbiddenToEdit}"
										 ajax="false"
										 styleClass="rounded-button"
						/>
						<h:commandButton rendered="#{guiInfo.issuedByInternalCa}"
										 action="#{ocspResponderMBean.commandRenewCertificate}"
										 id="renew"
										 value="#{web.text.INTERNALKEYBINDING_RENEWCERTIFICATE_SHORT}"
										 title="#{web.text.INTERNALKEYBINDING_RENEWCERTIFICATE_FULL}"
										 disabled="#{ocspResponderMBean.forbiddenToEdit}"
										 ajax="false"
										 styleClass="rounded-button"
						/>
						<h:commandButton action="#{ocspResponderMBean.commandDelete}"
										 id="delete"
										 value="#{web.text.INTERNALKEYBINDING_DELETE_SHORT}"
										 title="#{web.text.INTERNALKEYBINDING_DELETE_FULL}"

										 disabled="#{ocspResponderMBean.forbiddenToEdit}"
										 ajax="false"
										 styleClass="rounded-button"
						/>
					</div>
				</p:column>
			</p:dataTable>
			<h:panelGrid rendered="#{ocspResponderMBean.allowedToEdit}" styleClass="no-border no-padding row-padding-bottom-1-rem">
				<h:panelGroup>
					<h:button value="#{web.text.ADD}" id="addResponder" outcome="ocspresponder.xhtml?internalKeyBindingId=0"/>
				</h:panelGroup>
			</h:panelGrid>
		</h:form>
		<h:form id="uploadCertificate" enctype="multipart/form-data" rendered="#{not empty ocspResponderMBean.uploadTargets and ocspResponderMBean.allowedToEdit}">
			<h3 class="padding-bottom-1-rem"><h:outputText value="#{web.text.INTERNALKEYBINDING_OCSP_UPLOADHEADER}"/></h3>
			<h:panelGrid columns="3">
				<h:panelGroup>
					<h:outputLabel for="certificateUploadTarget" value="#{web.text.INTERNALKEYBINDING_OCSP_UPLOAD_TARGET}: "/>
					<h:selectOneMenu id="certificateUploadTarget" value="#{ocspResponderMBean.uploadTarget}">
						<f:selectItems value="#{ocspResponderMBean.uploadTargets}"/>
					</h:selectOneMenu>
				</h:panelGroup>
				<h:panelGroup>
					<h:outputLabel for="certificateUploadInput" value="#{web.text.INTERNALKEYBINDING_UPLOAD_CERTIFICATE}: "/>
					<h:inputFile id="certificateUploadInput" value="#{ocspResponderMBean.uploadToTargetFile}">
						<f:validator validatorId="keyBindingFileUploadValidator"/>
					</h:inputFile>
				</h:panelGroup>
				<h:commandButton action="#{ocspResponderMBean.uploadToTarget}" value="#{web.text.INTERNALKEYBINDING_UPLOAD}"/>
			</h:panelGrid>
		</h:form>
		</p:tab>
		<p:tab title="#{web.text.INTERNALKEYBINDING_TYPE_OCSP_CONFIGURATION}" >
			<h:form id="globalOcspConfiguration">
			  <h3 class="padding-bottom-1-rem">
			      <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_GLOBAL_CONFIGURATION}"/>
			      <h:outputText value="#{web.ejbcaWebBean.getHelpReference('/OCSP_Responders.html')}" escape="false"/>
			  </h3>
			  <p:panelGrid columns="3" columnClasses="ui-md-4,ui-md-4,ui-md-4">
			      <!-- Default Responder -->
			      <h:panelGroup>
			          <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_DEFAULTRESPONDER}"/>
			      </h:panelGroup>
			      <h:selectOneMenu id="defaultResponderTarget" value="#{ocspResponderMBean.defaultResponderTarget}" disabled="#{ocspResponderMBean.forbiddenToEdit}" styleClass="ui-md-11">
                    <f:selectItems value="#{ocspResponderMBean.defaultResponderTargets}"/>
                  </h:selectOneMenu>
                  <h:outputLabel value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_DEFAULTRESPONDER_HELP}" styleClass="smallHelp"/>
                  <!-- Enable OCSP Signing Cache Update -->
                  <h:panelGroup>
                    <h:outputText value="#{web.text.INTERNALKEYBINDING_ENABLE_OCSP_SIGNING_CACHE_UPDATE}"/>
                  </h:panelGroup>
                  <h:panelGroup>
                    <p:selectBooleanCheckbox id="globallyEnableOcspSigningCacheUpdate" disabled="#{ocspResponderMBean.forbiddenToEdit}" value="#{ocspResponderMBean.globallyEnableOcspSigningCacheUpdate}"/>
                  </h:panelGroup>
                  <h:panelGroup>
                    &nbsp;
                  </h:panelGroup>
                  <!-- Signing Certificate Cache Time -->
                  <h:panelGroup>
                     <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_SIGNING_CERTIFICATE_CACHE_TIME}"/>
                  </h:panelGroup>
                  <h:panelGroup>
                    <h:inputText disabled="#{not ocspResponderMBean.allowedToEdit}" value="#{ocspResponderMBean.signingCertificateCacheTime}"
                        styleClass="ui-md-11" id="signingCertificateCacheTime">
                            <f:converter converterId="jakarta.faces.Long"/>
                    </h:inputText>
                  </h:panelGroup>
                  <h:outputLabel value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_SIGNING_CERTIFICATE_CACHE_TIME_HELP}" styleClass="smallHelp"/>
                  
                  <!-- Signer Certificate Revocation Check Cache Time -->
                  <h:panelGroup>
                     <h:outputText value="#{web.text.INTERNALKEYBINDING_REQUEST_SIGNER_REVOCATION_CHECK_CACHE_TIME}"/>
                  </h:panelGroup>
                  <h:panelGroup>
                    <h:inputText disabled="#{not ocspResponderMBean.allowedToEdit}" value="#{ocspResponderMBean.requestSignerCertificateRevocationCacheTime}"
                        styleClass="ui-md-11" id="requestSignerRevocationCheckCacheTime">
                            <f:converter converterId="jakarta.faces.Long"/>
                    </h:inputText>
                  </h:panelGroup>
                  <h:panelGroup>
                    <h:outputLabel value="#{web.text.INTERNALKEYBINDING_REQUEST_SIGNER_REVOCATION_CHECK_CACHE_TIME_HELP}" styleClass="smallHelp"/>
                  </h:panelGroup>
                  
	              <!-- Enable cache for unknown status -->
	              <h:outputText value="#{web.text.INTERNALKEYBINDING_ENABLE_CACHE_FOR_UNAUTHORIZED_RESPONSES}"/>
	              <p:selectBooleanCheckbox id="globallyEnableOcspBrowserCacheUnknownStatus"
                                             disabled="#{ocspResponderMBean.forbiddenToEdit}"
                                             value="#{ocspResponderMBean.cacheHeaderUnauthorizedResponses}"/>
	              <h:panelGroup>
                    &nbsp;
                  </h:panelGroup>
                  <!-- OCSP Response Cleanup -->
                  <h:panelGroup>
                    <h:outputText for="ocspCleanupEnable" value="#{web.text.OCSP_RESPONSE_CLEANUP}"/>
                    <h:outputText value="#{web.ejbcaWebBean.getHelpReference('/OCSP_Response_Pre-Production.html')}" escape="false"/>
                  </h:panelGroup>
                    <h:panelGroup id="ocspCleanupGroup">
                       <p:selectBooleanCheckbox id="ocspCleanupEnable"
                                             value="#{ocspResponderMBean.ocspCleanupUse}"
                                             disabled="#{!ocspResponderMBean.allowedToEditSystemConfiguration}"
                                             immediate="true">
                            <f:ajax render="globalOcspConfiguration:ocspCleanupGroup"/>
                       </p:selectBooleanCheckbox>
                       <br/>
                       <h:inputText id="ocspCleanupInterval"
                                 disabled="#{!ocspResponderMBean.allowedToEditSystemConfiguration or !ocspResponderMBean.ocspCleanupUse}"
                                 value="#{ocspResponderMBean.ocspCleanupSchedule}" size="10"/>
    
                       <h:selectOneMenu disabled="#{!ocspResponderMBean.allowedToEditSystemConfiguration or !ocspResponderMBean.ocspCleanupUse}"
                                     value="#{ocspResponderMBean.ocspCleanupScheduleUnit}"
                                     style="margin-left:5px; min-width:100px">
                           <f:selectItems value="#{ocspResponderMBean.availableOcspCleanupUnits}"/>
                       </h:selectOneMenu>
                    </h:panelGroup>
                    <h:outputText value="#{web.text.OCSP_RESPONSE_CLEANUP_EXP}" styleClass="smallHelp"/>
                  
			  </p:panelGrid>
			  <h:commandButton action="#{ocspResponderMBean.saveGlobalOcspConfiguration}" rendered="#{ocspResponderMBean.allowedToEdit}" value="#{web.text.INTERNALKEYBINDING_SAVE}" id="saveGlobalSettings"/>
			</h:form>
			<h:form id="caOcspBehavior">
			 <h3 class="padding-top-1-rem">
                <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_CA_BEHAVIOR}"/>
             </h3>
			  <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_CA_BEHAVIOR_HELP}" styleClass="smallHelp"/>
              <p:panelGrid columns="3" columnClasses="ui-md-4,ui-md-4,ui-md-4" styleClass="padding-top-1-rem">
                <!-- Global Nonexisting Response -->
                <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_NONEXISTINGRESPONSE_GLOBAL}" />
                <h:selectOneMenu value="#{ocspResponderMBean.currentGlobalUnknownResponse}" disabled="#{!ocspResponderMBean.inEditMode}" styleClass="ui-md-11" id="caReseponseForUnknownCertificates">
                    <f:selectItems value="#{ocspResponderMBean.availableUnknownResponses}"/>
                </h:selectOneMenu>
                <h:panelGroup>
                    &nbsp;
                </h:panelGroup>
                <!-- Include signing certificate in response from CAs -->
                <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_INCLUDESIGNCER_GLOBAL}"/>
                <p:selectBooleanCheckbox id="globalIncludeSigningCert" disabled="#{ocspResponderMBean.forbiddenToEdit}" value="#{ocspResponderMBean.globalIncludeSigningCertificate}"/>
                <h:panelGroup>
                     &nbsp;
                </h:panelGroup>
                <!-- Include certificate chain in response from CAs -->
                <h:outputText value="#{web.text.INTERNALKEYBINDING_OCSPKEYBINDING_INCLUDECERTCHAIN_GLOBAL}"/>
                <p:selectBooleanCheckbox id="globalIncludeCertificateChain" disabled="#{ocspResponderMBean.forbiddenToEdit}" value="#{ocspResponderMBean.globalIncludeCertificateChain}"/>
                <h:panelGroup>
                     &nbsp;
                </h:panelGroup>
                 <!-- Enable nonce for CAs -->
                <h:outputText value="#{web.text.INTERNALKEYBINDING_ENABLED_NONCE_CA}"/>
                <p:selectBooleanCheckbox id="globallyEnableNonce" disabled="#{ocspResponderMBean.forbiddenToEdit}" value="#{ocspResponderMBean.globallyEnableNonce}"/>
                 <h:panelGroup>
                     &nbsp;
                </h:panelGroup>
                <!-- Responder ID Type for CAs -->
                <h:outputText value="#{web.text.INTERNALKEYBINDING_DEFAULT_RESPONDERIDTYPE}"/>
                <h:selectOneMenu id="defaultResponderId" value="#{ocspResponderMBean.responderIdType}" disabled="#{ocspResponderMBean.forbiddenToEdit}" styleClass="ui-md-11">
                    <f:selectItems value="#{ocspResponderMBean.responderIdTargets}"/>
                </h:selectOneMenu>
                <h:panelGroup>
                     &nbsp;
                </h:panelGroup>
                <!-- Response Validity -->
                <h:outputText value="#{web.text.INTERNALKEYBINDING_VALIDITY_DEFAULTS}"/>
                <h:inputText disabled="#{not ocspResponderMBean.allowedToEdit}" value="#{ocspResponderMBean.defaultResponseValidity}"
                        onchange="this.form.submit()" styleClass="ui-md-11" id="defaultValidityTimes">
                            <f:converter converterId="jakarta.faces.Long"/>
                 </h:inputText>
                 <h:outputText value="#{web.text.INTERNALKEYBINDING_VALIDITY_HELP}" styleClass="smallHelp"/>
                 <!--  Default Max Validity -->
                 <h:outputText value="#{web.text.INTERNALKEYBINDING_VALIDITY_MAX}"/>
                 <h:inputText disabled="#{not ocspResponderMBean.allowedToEdit}" value="#{ocspResponderMBean.defaultResponseMaxAge}"
                        onchange="this.form.submit()" styleClass="ui-md-11" id="maxAgeHttpHeader">
                            <f:converter converterId="jakarta.faces.Long"/>
                 </h:inputText>
                 <h:outputText value="#{web.text.INTERNALKEYBINDING_VALIDITY_MAX_HELP}" styleClass="smallHelp"/>
                 <!-- Max age at expiration -->
                 <h:outputText value="#{web.text.INTERNALKEYBINDING_VALIDITY_MAX_EXPIRATION}"/>
                 <p:selectBooleanCheckbox value="#{ocspResponderMBean.useMaxValidityForExpiration}"
                                             disabled="#{not ocspResponderMBean.allowedToEdit or ocspResponderMBean.defaultResponseMaxAge == '0'}"
                                             onchange="this.form.submit()"
                                             id="useMaxAgeForExpiredResponses"
                 />
                 <h:outputText value="#{web.text.INTERNALKEYBINDING_VALIDITY_MAX_EXPIRATION_HELP}" styleClass="smallHelp"/>
                
              </p:panelGrid>

              <h:commandButton action="#{ocspResponderMBean.saveGlobalCaSettings}" rendered="#{ocspResponderMBean.allowedToEdit}" value="#{web.text.INTERNALKEYBINDING_SAVE}" id="saveCAConfiguration">
                <f:ajax event="change" render="@form" />
              </h:commandButton>
			</h:form>

		<!-- Settings for OCSP audit and transaction logging -->
		<h:form id="ocspLoggingSettings">
			<h3 class="padding-top-1-rem padding-bottom-1-rem">
				<h:outputText value="#{web.text.OCSP_LOGGING_HEADER}"/>
				<h:outputText value="#{web.ejbcaWebBean.getHelpReference('/OCSP_Responders.html')}" escape="false"/>
			</h3>
			<h:panelGrid id="ocspLoggingSettings" columns="2" columnClasses="ui-md-3">
				<h:panelGroup>
					<p:selectBooleanCheckbox id="enableOcspTransactionLogging"
											 value="#{ocspResponderMBean.isOcspTransactionLoggingEnabled}"
											 disabled="#{not ocspResponderMBean.allowedToEdit}"
                                             itemLabel="#{web.text.OCSP_LOGGING_ENABLE_TRANSACTION_LOGGING}"
                    >
						<f:ajax render="ocspLoggingSettings"/>
					</p:selectBooleanCheckbox>
				</h:panelGroup>
				<div/>
				<h:outputLabel value="#{web.text.OCSP_LOGGING_TRANSACTION_LOG_PATTERN}"
							   rendered="#{ocspResponderMBean.isOcspTransactionLoggingEnabled}"
                               for="transactionLogPattern" styleClass="align-label"
                />
				<h:panelGroup rendered="#{ocspResponderMBean.isOcspTransactionLoggingEnabled}">
					<h:inputText value="#{ocspResponderMBean.ocspTransactionLogPattern}"
								 disabled="#{not ocspResponderMBean.allowedToEdit}" styleClass="ui-md-11" id="transactionLogPattern"/>
					<br/>
					<h:outputLabel value="#{web.text.OCSP_LOGGING_TRANSACTION_LOG_PATTERN_HINT}" styleClass="smallHelp"/>
				</h:panelGroup>
				<h:outputLabel value="#{web.text.OCSP_LOGGING_TRANSACTION_LOG_VALUES}"
                               rendered="#{ocspResponderMBean.isOcspTransactionLoggingEnabled}"
                               for="transactionLogMessage"
                />
				<h:panelGroup rendered="#{ocspResponderMBean.isOcspTransactionLoggingEnabled}">
					<h:inputTextarea value="#{ocspResponderMBean.ocspTransactionLogValues}"
									 disabled="#{not ocspResponderMBean.allowedToEdit}" rows="5" styleClass="ui-md-11" id="transactionLogMessage" />
					<br/>
					<h:outputLabel value="#{web.text.OCSP_LOGGING_TRANSACTION_LOG_VALUES_HINT}" styleClass="smallHelp"/>
				</h:panelGroup>
				<h:panelGroup rendered="#{ocspResponderMBean.isOcspTransactionLoggingEnabled}"/>
				<h:panelGroup id="testTransactionLogging" rendered="#{ocspResponderMBean.isOcspTransactionLoggingEnabled}">
					<h:commandButton value="#{web.text.OCSP_LOGGING_TEST_TRANSACTION_LOGGING}"
									 action="#{ocspResponderMBean.commandTestOcspTransactionLogging}">
						<f:ajax render="testTransactionLogging" execute="@form"/>
					</h:commandButton>
					<br/><br/>
					<h:outputText value="#{ocspResponderMBean.ocspTransactionLogMessage}"
								  rendered="#{ocspResponderMBean.isOcspTransactionLoggingEnabled}" styleClass="padding-top-1-rem padding-bottom-1-rem"/>
				</h:panelGroup>

				<h:panelGroup>
					<p:selectBooleanCheckbox id="enableOcspAuditLogging"
											 value="#{ocspResponderMBean.isOcspAuditLoggingEnabled}"
											 disabled="#{not ocspResponderMBean.allowedToEdit}"
                                             itemLabel="#{web.text.OCSP_LOGGING_ENABLE_AUDIT_LOGGING}">
						<f:ajax render="ocspLoggingSettings"/>
					</p:selectBooleanCheckbox>
				</h:panelGroup>
				<div/>
                <h:outputLabel value="#{web.text.OCSP_LOGGING_AUDIT_LOG_PATTERN}" rendered="#{ocspResponderMBean.isOcspAuditLoggingEnabled}" for="auditLogPattern"/>

					<h:inputText value="#{ocspResponderMBean.ocspAuditLogPattern}"
								 disabled="#{not ocspResponderMBean.allowedToEdit}"
                                 styleClass="ui-md-11"
                                 id="auditLogPattern"
                    />
					<br/>
					<h:outputLabel value="#{web.text.OCSP_LOGGING_AUDIT_LOG_PATTERN_HINT}" styleClass="smallHelp"/>
				</h:panelGroup>
				<h:outputLabel value="#{web.text.OCSP_LOGGING_AUDIT_LOG_VALUES}" rendered="#{ocspResponderMBean.isOcspAuditLoggingEnabled}" for="auditLogMessage"/>
				<h:panelGroup rendered="#{ocspResponderMBean.isOcspAuditLoggingEnabled}">
					<h:inputTextarea value="#{ocspResponderMBean.ocspAuditLogValues}"
									 disabled="#{not ocspResponderMBean.allowedToEdit}" rows="5" styleClass="ui-md-11" id="auditLogMessage" />
					<br/>
					<h:outputLabel value="#{web.text.OCSP_LOGGING_AUDIT_LOG_VALUES_HINT}" styleClass="smallHelp"/>
				</h:panelGroup>
				<h:panelGroup rendered="#{ocspResponderMBean.isOcspAuditLoggingEnabled}"/>
				<h:panelGroup id="testAuditLogging" rendered="#{ocspResponderMBean.isOcspAuditLoggingEnabled}">
					<h:commandButton value="#{web.text.OCSP_LOGGING_TEST_AUDIT_LOGGING}"
									 action="#{ocspResponderMBean.commandTestOcspAuditLogging}">
						<f:ajax render="testAuditLogging" execute="@form"/>
					</h:commandButton>
					<br/><br/>
					<h:outputText value="#{ocspResponderMBean.ocspAuditLogMessage}"
								  rendered="#{ocspResponderMBean.isOcspAuditLoggingEnabled}" styleClass="padding-top-1-rem padding-bottom-1-rem"/>
				</h:panelGroup>

				<h:outputLabel value="#{web.text.OCSP_LOGGING_DATE_FORMAT}" rendered="#{ocspResponderMBean.isOcspAuditLoggingEnabled or ocspResponderMBean.isOcspTransactionLoggingEnabled}" for="logDateFormat" styleClass="align-label"/>
				<h:panelGroup rendered="#{ocspResponderMBean.isOcspAuditLoggingEnabled or ocspResponderMBean.isOcspTransactionLoggingEnabled}">
					<h:inputText value="#{ocspResponderMBean.ocspLoggingDateFormat}"
								 disabled="#{not ocspResponderMBean.allowedToEdit}" rows="5" styleClass="ui-md-11" id="logDateFormat"/>

					<h:outputLabel value="#{web.text.OCSP_LOGGING_DATE_FORMAT_HINT}" styleClass="smallHelp"/>
				</h:panelGroup>
			</h:panelGrid>
			<h:commandButton value="#{web.text.OCSP_LOGGING_SAVE}" action="#{ocspResponderMBean.saveOcspLoggingConfiguration}" id="applyLoggingSettings"/>
		</h:form>
