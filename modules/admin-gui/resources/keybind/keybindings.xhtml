<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:fn="jakarta.tags.functions"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/include/template.xhtml">
    <ui:param name="resourceBean" value="#{remoteAuthenticationMBean}"/>
    <ui:define name="content">

        <h:outputText value="" rendered="#{remoteAuthenticationMBean.pageLoadResetTrigger}"/>
        <h1>
            <h:outputText value="#{web.text.INTERNALKEYBINDING_TYPE_REMOTE}"/>
            <h:outputText value="#{web.ejbcaWebBean.getHelpReference('/Remote_Authenticators_Overview.html')}"
                          escape="false"/>
        </h1>

        <h3 class="padding-bottom-1-rem">
            <h:outputText value="#{web.text.INTERNALKEYBINDING_TYPE_REMOTE_LIST_OF_REMOTEAUTHENTICATORS}"/>
        </h3>
        <h:panelGroup>
            <h:outputText value="#{web.text.INTERNALKEYBINDING_AUTHENTICATIONKEYBINDING_DESCRIPTION}"/>
        </h:panelGroup>
        <h:form id="internalkeybindings">
            <p:dataTable value="#{remoteAuthenticationMBean.internalKeyBindingGuiList}" var="guiInfo"
                         id="remoteAuthenticationList"
                         styleClass="grid table-layout-auto vertical-padding-1"
                         stripedRows="true" showGridlines="true">
                <p:column styleClass="table-title-column">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.INTERNALKEYBINDING_NAME}"/>
                    </f:facet>
                    <h:outputLink
                            value="keybinding.xhtml?internalKeyBindingId=#{guiInfo.internalKeyBindingId}">
                        <h:outputText value="#{guiInfo.name}"
                                      title="#{web.text.INTERNALKEYBINDING_VIEWWITH} #{guiInfo.internalKeyBindingId}"/>
                    </h:outputLink>
                </p:column>

                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.INTERNALKEYBINDING_CERTIFICATEISSUER}"/>
                    </f:facet>
                    <h:outputLink value="/ejbca/adminweb/viewcertificate.xhtml" rendered="#{guiInfo.certificateBound}">
                        <f:param name="certsernoparameter"
                                 value="#{guiInfo.caCertificateSerialNumber},#{fn:escapeXml(guiInfo.caCertificateIssuerDn)}"/>
                        <f:param name="returnTo" value="3"/>
                        <h:outputText value="#{guiInfo.certificateInternalCaName}"
                                      rendered="#{guiInfo.issuedByInternalCa}"/>
                        <h:outputText value="#{guiInfo.certificateIssuerDn}" rendered="#{!guiInfo.issuedByInternalCa}"/>
                    </h:outputLink>
                    <h:outputText value="#{web.text.INTERNALKEYBINDING_NOT_PRESENT}"
                                  rendered="#{!guiInfo.certificateBound}"/>
                </p:column>

                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.INTERNALKEYBINDING_CERTIFICATESERIAL}"/>
                    </f:facet>
                    <h:outputLink value="/ejbca/adminweb/viewcertificate.xhtml" rendered="#{guiInfo.certificateBound}">
                        <f:param name="certsernoparameter"
                                 value="#{guiInfo.certificateSerialNumber},#{fn:escapeXml(guiInfo.certificateIssuerDn)}"/>
                        <f:param name="returnTo" value="3"/>
                        <h:outputText value="#{guiInfo.certificateSerialNumber}"/>
                    </h:outputLink>
                    <h:outputText value="#{web.text.INTERNALKEYBINDING_NOT_PRESENT}"
                                  rendered="#{!guiInfo.certificateBound}"/>
                </p:column>

                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.INTERNALKEYBINDING_CRYPTOTOKEN}"/>
                    </f:facet>
                    <h:outputLink
                            value="/ejbca/adminweb/cryptotoken/cryptotoken.xhtml?cryptoTokenId=#{guiInfo.cryptoTokenId}&amp;ref=keybindings">
                        <h:outputText value="#{guiInfo.cryptoTokenName}"
                                      title="#{web.text.CRYPTOTOKEN_VIEWWITH} #{guiInfo.cryptoTokenId}"/>
                    </h:outputLink>
                </p:column>

                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.INTERNALKEYBINDING_KEYPAIRALIAS}"/>
                    </f:facet>
                    <h:outputText value="#{guiInfo.keyPairAlias}"/>
                </p:column>

                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.INTERNALKEYBINDING_NEXTKEYPAIRALIAS}"/>
                    </f:facet>
                    <h:outputText rendered="#{guiInfo.nextKeyAliasAvailable}" value="#{guiInfo.nextKeyPairAlias}"/>
                </p:column>

                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.INTERNALKEYBINDING_STATUS}"/>
                    </f:facet>
                    <h:outputText value="#{web.text[guiInfo.status]}"/>
                </p:column>

                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.INTERNALKEYBINDING_OPERATIONAL_STATUS}"/>
                    </f:facet>
                    <h:graphicImage height="16" width="16" url="#{guiInfo.operationalStatus}"/>
                </p:column>

                <p:column styleClass="text-align-left" rendered="#{!remoteAuthenticationMBean.forbiddenToEdit}">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.INTERNALKEYBINDING_ACTIONS}"/>
                    </f:facet>
                    <div class="action-buttons">
                        <h:commandButton rendered="#{guiInfo.status ne 'INTERNALKEYBINDING_STATUS_DISABLED'}"
                                         action="#{remoteAuthenticationMBean.commandDisable(guiInfo)}"
                                         id="disable"
                                         value="#{web.text.INTERNALKEYBINDING_DISABLE_SHORT}"
                                         title="#{web.text.INTERNALKEYBINDING_DISABLE_FULL}"
                                         disabled="#{remoteAuthenticationMBean.forbiddenToEdit}"
                                         ajax="false"
                                         styleClass="rounded-button"
                        />
                        <h:commandButton rendered="#{guiInfo.status eq 'INTERNALKEYBINDING_STATUS_DISABLED'}"
                                         action="#{remoteAuthenticationMBean.commandEnable(guiInfo)}"
                                         id="enable"
                                         value="#{web.text.INTERNALKEYBINDING_ENABLE_SHORT}"
                                         title="#{web.text.INTERNALKEYBINDING_ENABLE_FULL}"
                                         disabled="#{remoteAuthenticationMBean.forbiddenToEdit}"
                                         ajax="false"
                                         styleClass="rounded-button"
                        />
                        <h:commandButton
                                rendered="#{!guiInfo.nextKeyAliasAvailable and guiInfo.authorizedToGenerateKeys}"
                                action="#{remoteAuthenticationMBean.commandGenerateNewKey(guiInfo)}"
                                id="generateNewKeys"
                                value="#{web.text.INTERNALKEYBINDING_GENERATENEWKEY_SHORT}"
                                title="#{web.text.INTERNALKEYBINDING_GENERATENEWKEY_FULL}"
                                disabled="#{remoteAuthenticationMBean.forbiddenToEdit}"
                                ajax="false"
                                styleClass="rounded-button"
                        />
                        <h:commandButton rendered="#{guiInfo.authorizedToCryptoToken}"
                                         action="#{remoteAuthenticationMBean.commandGenerateRequest(guiInfo)}"
                                         id="csr"
                                         value="#{web.text.INTERNALKEYBINDING_GETCSR_SHORT}"
                                         title="#{web.text.INTERNALKEYBINDING_GETCSR_FULL}"
                                         disabled="#{remoteAuthenticationMBean.forbiddenToEdit}"
                                         ajax="false"
                                         styleClass="rounded-button"
                        />
                        <h:commandButton action="#{remoteAuthenticationMBean.commandReloadCertificate(guiInfo)}"
                                         value="#{web.text.INTERNALKEYBINDING_RELOADCERTIFICATE_SHORT}"
                                         id="reload"
                                         title="#{web.text.INTERNALKEYBINDING_RELOADCERTIFICATE_FULL}"
                                         disabled="#{remoteAuthenticationMBean.forbiddenToEdit}"
                                         ajax="false"
                                         styleClass="rounded-button"
                        />
                        <h:commandButton rendered="#{guiInfo.issuedByInternalCa}"
                                         action="#{remoteAuthenticationMBean.commandRenewCertificate(guiInfo)}"
                                         id="renew"
                                         value="#{web.text.INTERNALKEYBINDING_RENEWCERTIFICATE_SHORT}"
                                         title="#{web.text.INTERNALKEYBINDING_RENEWCERTIFICATE_FULL}"
                                         disabled="#{remoteAuthenticationMBean.forbiddenToEdit}"
                                         ajax="false"
                                         styleClass="rounded-button"
                        />
                        <h:commandButton action="#{remoteAuthenticationMBean.commandDelete(guiInfo)}"
                                         id="delete"
                                         value="#{web.text.INTERNALKEYBINDING_DELETE_SHORT}"
                                         title="#{web.text.INTERNALKEYBINDING_DELETE_FULL}"
                                         disabled="#{remoteAuthenticationMBean.forbiddenToEdit}"
                                         ajax="false"
                                         styleClass="rounded-button"
                        />
                    </div>
                </p:column>
            </p:dataTable>
            <h:panelGrid rendered="#{remoteAuthenticationMBean.allowedToEdit}"
                         styleClass="no-border no-padding row-padding-bottom-1-rem">
                <h:panelGroup>
                    <h:button value="#{web.text.ADD}" id="addRemoteAuthentication"
                              outcome="keybinding.xhtml?internalKeyBindingId=0"/>
                </h:panelGroup>
            </h:panelGrid>
        </h:form>

        <h:form id="uploadCertificate" enctype="multipart/form-data"
                rendered="#{not empty remoteAuthenticationMBean.uploadTargets and remoteAuthenticationMBean.allowedToEdit}">
            <h3><h:outputText value="#{web.text.INTERNALKEYBINDING_REMOTE_UPLOADHEADER}"/></h3>
            <h:panelGrid columns="3">
                <h:panelGroup>
                    <h:outputLabel for="certificateUploadTarget"
                                   value="#{web.text.INTERNALKEYBINDING_REMOTE_UPLOAD_TARGET}: "/>
                    <h:selectOneMenu id="certificateUploadTarget" value="#{remoteAuthenticationMBean.uploadTarget}">
                        <f:selectItems value="#{remoteAuthenticationMBean.uploadTargets}"/>
                    </h:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup>
                    <h:outputLabel for="certificateUploadInput"
                                   value="#{web.text.INTERNALKEYBINDING_UPLOAD_CERTIFICATE}: "/>
                    <h:inputFile id="certificateUploadInput" value="#{remoteAuthenticationMBean.uploadToTargetFile}">
                        <f:validator validatorId="keyBindingFileUploadValidator"/>
                    </h:inputFile>
                </h:panelGroup>
                <h:commandButton action="#{remoteAuthenticationMBean.uploadToTarget}"
                                 value="#{web.text.INTERNALKEYBINDING_UPLOAD}"/>
            </h:panelGrid>
        </h:form>
    </ui:define>
</ui:composition>
</html>
