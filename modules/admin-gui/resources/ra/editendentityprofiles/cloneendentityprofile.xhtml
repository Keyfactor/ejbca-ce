<ui:composition template="/WEB-INF/include/template.xhtml">
    <ui:param name="resourceBean" value="#{endEntityProfilesMBean}"/>
    <ui:define name="content">
        <h1>
				  <h:outputText value="#{web.text.MANAGEENDENTITYPROFILES}"/>
			  </h1>
        <h:form>
            <h:panelGroup rendered="#{endEntityProfilesMBean.authorizedToEdit}">
                <h3>
                    <h:outputText value="#{web.text.CLONE}"/>
                </h3>
                <h:panelGrid columns="2">
                    <h:outputLabel for="clonedProfileNameTemplate" value="#{web.text.EE_PROFILE_CLONE_TEMPLATE}"/>
                    <h:outputText id="clonedProfileName" value="#{endEntityProfilesMBean.endEntityProfileName}"/>
                    <h:outputLabel for="clonedProfileNewNamePrompt" value="#{web.text.EE_PROFILE_CLONE_NEW_NAME}"/>
                    <h:inputText id="clonedProfileNewName" name="textfieldalias"
                                 value="#{endEntityProfilesMBean.clonedProfileName}" size="40"
                                 title="#{web.text.FORMAT_ID_STR}">
                        <f:converter converterId="trimConverter"/>
                    </h:inputText>
                    <h:panelGroup/>
                    <h:panelGroup>
                        <h:commandButton id="cloneProfileSaveButton" name="cloneProfileSaveButton"
                                         action="#{endEntityProfilesMBean.actionCloneConfirm}" value="#{web.text.CLONE_CONFIRM}"/>
                        <h:commandButton id="cloneProfileCancelbutton" name="cloneProfileCancelbutton"
                                         action="cancel" value="#{web.text.CANCEL}" immediate="true"/>
                    </h:panelGroup>
                </h:panelGrid>
            </h:panelGroup>
        </h:form>
    </ui:define>
</ui:composition>
