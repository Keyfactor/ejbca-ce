<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">
    <ui:remove>

     <ui:composition template="/WEB-INF/include/template.xhtml">
         <ui:param name="resourceBean" value="#{endEntityProfilesMBean}" />
		 <f:metadata>
			 <f:event type="preRenderView" listener="#{endEntityProfilesMBean.preRenderView}"/>
		</f:metadata>
	 	<ui:define name="content">
	 		<h1>
				<h:outputText value="#{web.text.MANAGEENDENTITYPROFILES}"/>
			</h1>
			<h:form id="manageEndEntityProfiles" rendered="#{endEntityProfilesMBean.authorizedToView}">
				<h:panelGroup>
	 				<h3>
	 					<h:outputText value="#{web.text.LISTOFENDENTITYPROFILES}"/>
	 				</h3>
	 			    
	 			    <p:dataTable value="#{endEntityProfilesMBean.endEntityProfiles}" var="endEntityProfile"
                                 styleClass="grid table-layout-auto vertical-padding-1" stripedRows="true" showGridlines="true">
                <p:column styleClass="table-title-column">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.NAME}"/>
                    </f:facet>
                    <h:outputText value="#{endEntityProfile}" title="#{endEntityProfile}"/>
                </p:column>
                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.ACTIONS}"/>
                    </f:facet>
                    <div class="action-buttons">
                        <h:commandButton id="buttonviewalias"
                                         value="#{web.text.VIEW}"
                                         action="#{endEntityProfilesMBean.actionView(endEntityProfile)}">
                        </h:commandButton>
                        <h:commandButton value="#{web.text.EDIT}"
                                         action="#{endEntityProfilesMBean.actionEdit(endEntityProfile)}"
                                         rendered="#{endEntityProfilesMBean.authorizedToEdit}">
                        </h:commandButton>
                        <h:commandButton value="#{web.text.CLONE}"
                                         action="#{endEntityProfilesMBean.actionClone(endEntityProfile)}"
                                         rendered="#{endEntityProfilesMBean.authorizedToEdit}"/>
                        <h:commandButton value="#{web.text.EXPORT}"
                                         action="#{endEntityProfilesMBean.actionExportProfile(endEntityProfile)}"
                                         rendered="#{endEntityProfilesMBean.authorizedToEdit}"/>
                        <h:commandButton value="#{web.text.DELETE}"
                                         action="#{endEntityProfilesMBean.actionDelete(endEntityProfile)}"
                                         rendered="#{endEntityProfilesMBean.authorizedToEdit}"/>
                    </div>
                </p:column>
            </p:dataTable>
            
            <h:commandButton 
							id="addButton" 
							class="buttonstyle" 
							action="#{endEntityProfilesMBean.actionAdd}" 
							value="#{web.text.ADD}"
							rendered="#{endEntityProfilesMBean.authorizedToEdit}"/>
			  </h:panelGroup>
			</h:form>

            <h3 class="vertical-padding-1">
                <h:outputText value="#{web.text.IMPORT}/" rendered="#{endEntityProfilesMBean.authorizedToEdit}"/>
                <h:outputText value="#{web.text.EXPORT}"/>
            </h3>

			<h:form
				id="uploadProfiles"
				enctype="multipart/form-data"
				rendered="#{endEntityProfilesMBean.authorizedToEdit}"
                styleClass="no-border no-padding row-padding-bottom-1-rem">
				<ui:remove><!-- Manually add viewstate due to https://java.net/jira/browse/JAVASERVERFACES_SPEC_PUBLIC-790 --></ui:remove>
                <h:outputText escape="false" value="&lt;input name='jakarta.faces.ViewState' type='hidden' value='#{facesContext.application.stateManager.getViewState(facesContext)}'/&gt;"/>
                <h:panelGrid columns="1" >
                    <h:outputLabel for="profileUploadInput" value="#{web.text.IMPORTPROFILESFROM}"
                                   rendered="#{endEntityProfilesMBean.authorizedToEdit}"/>
                    <h:panelGroup>
                        <div class="action-buttons">
                            <h:inputFile
                                    id="profileUploadInput"
                                    value="#{endEntityProfilesMBean.uploadFile}"
                                    size="20"/>
                            <h:commandButton
                                    id="importButton"
                                    action="#{endEntityProfilesMBean.actionImportProfiles}"
                                    value="#{web.text.IMPORTPROFILE}"/>
                            <h:commandButton
                                    id="exportAllProfilesButton"
                                    class="buttonstyle"
                                    action="#{endEntityProfilesMBean.actionExportProfiles}"
                                    value="#{web.text.EXPORTPROFILES}"/>
                        </div>
                    </h:panelGroup>
                </h:panelGrid>
			</h:form>
		</ui:define>
</ui:composition>
</html>
