<ui:composition template="/WEB-INF/include/template.xhtml">
    <ui:param name="resourceBean" value="#{listPublishers}"/>
    <ui:define name="content">
        <h1>
            <h:outputText value="#{web.text.MANAGEPUBLISHERS}"/>
        </h1>
        <h:form>
            <h:panelGroup rendered="#{listPublishers.hasEditRights}">
                <h3>
                    <h:outputText value="#{web.text.DELETE}"/>
                </h3>
                <h:panelGrid columns="2">
                    <h:outputLabel for="deletedPublisherName" value="#{web.text.NAME}:"/>
                    <h:outputText id="deletedPublisherName" value="#{listPublishers.selectedPublisherName}"/>
                    <h:panelGroup/>
                    <h:panelGroup styleClass="action-buttons">
                        <h:commandButton id="deleteCaSaveButton" name="deleteCaSaveButton" ajax="false"
                                         action="#{listPublishers.deletePublisher}" value="#{web.text.DELETE_CONFIRM}"/>
                        <h:commandButton id="deletePublisherCancelButton" name="deletePublisherCancelButton" ajax="false"
                                         action="listpublishers?faces-redirect=true" value="#{web.text.CANCEL}" immediate="true"/>
                    </h:panelGroup>
                </h:panelGrid>
            </h:panelGroup>
        </h:form>
    </ui:define>
</ui:composition>
