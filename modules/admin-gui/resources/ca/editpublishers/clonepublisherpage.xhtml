<ui:composition template="/WEB-INF/include/template.xhtml">
    <ui:param name="resourceBean" value="#{listPublishers}"/>
    <ui:define name="content">
        <h1>
            <h:outputText value="#{web.text.MANAGEPUBLISHERS}" />
        </h1>
        <h:form rendered="#{web.ejbcaWebBean.runningEnterprise}">
            <h:panelGroup rendered="#{listPublishers.hasEditRights}">
                <h3>
                    <h:outputText value="#{web.text.CLONE}"/>
                </h3>
                <h:panelGrid columns="2">
                    <h:outputLabel for="clonePublisherTemplateName" value="#{web.text.PUBLISHERCLONETEMPLATE}"/>
                    <h:outputText id="clonePublisherTemplateName" value="#{listPublishers.selectedPublisherName}"/>
                    <h:outputLabel for="clonedPublisherName" value="#{web.text.PUBLISHERCLONENEWNAME}"/>
                    <h:inputText id="clonedPublisherName" name="textfieldPublisher"
                                 value="#{listPublishers.newPublisherName}" size="40"
                                 title="#{web.text.FORMAT_ID_STR}"
                                 required="true"
                                 requiredMessage="#{web.text.YOUAREREQUIRED} #{web.text.PUBLISHERCLONENEWNAME}">
                        <f:converter converterId="trimConverter"/>
                    </h:inputText>
                    <h:panelGroup/>
                    <h:panelGroup>
                        <p:commandButton id="clonePublisherSaveButton" name="clonePublisherSaveButton" style="margin-right:10px;" ajax="false"
                                         action="#{listPublishers.clonePublisher}" value="#{web.text.CLONE_CONFIRM}"/>
                        <p:commandButton id="clonePublisherCancelbutton" name="clonePublisherCancelbutton" ajax="false"
                                         action="listpublishers?faces-redirect=true" value="#{web.text.CANCEL}" immediate="true">
                            <f:setPropertyActionListener
                                    target="#{listPublishers.newPublisherName}" value="" />
                        </p:commandButton>
                    </h:panelGroup>
                </h:panelGrid>
            </h:panelGroup>
        </h:form>
    </ui:define>
</ui:composition>
</html>
