    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"

<body>
<ui:composition template="/WEB-INF/include/template.xhtml">
 	<ui:param name="resourceBean" value="#{listPublishers}" />
	<ui:define name="content">
		<h1>
			<h:outputText value="#{web.text.MANAGEPUBLISHERS}" />
		</h1>

		<h3>
			<h:outputText value="#{web.text.LISTOFPUBLISHERS}" />
		</h3>
		<h:form id="listPublishers">
			<p:dataTable value="#{listPublishers.publisherGuiList}"
						 var="publisherGuiInfo"
                         rendered="#{!listPublishers.aliasListEmpty}"
						 styleClass="grid table-layout-auto vertical-padding-1" stripedRows="true" showGridlines="true">
				<p:column rendered="false">
					<h:selectBooleanCheckbox value="#{listPublishers.selectedPublisherName}" />
				</p:column>

				<p:column styleClass="table-title-column">
					<f:facet name="header">
						<h:outputText value="#{web.text.NAME}"/>
					</f:facet>
					<h:outputText value="#{publisherGuiInfo.name}"/>
				</p:column>

				<p:column styleClass="text-align-center">
					<f:facet name="header">
						<h:outputText value="#{web.text.TYPE}"/>
					</f:facet>
					<h:outputText value="#{publisherGuiInfo.type}"/>
				</p:column>

				<p:column styleClass="text-align-center">
					<f:facet name="header">
						<h:outputText value="#{web.text.ACTIONS}"/>
					</f:facet>
					<div class="action-buttons">
						<h:commandButton value="#{web.text.VIEW}" ajax="fasle"
										 action="#{listPublishers.viewPublisher}">
							<f:setPropertyActionListener
									target="#{listPublishers.selectedPublisherName}"
									value="#{publisherGuiInfo.name}"/>
						</h:commandButton>
						<h:commandButton value="#{web.text.EDIT}"
										 action="#{listPublishers.editPublisher}"
										 rendered="#{listPublishers.hasEditRights}">
							<f:setPropertyActionListener
									target="#{listPublishers.selectedPublisherName}"
									value="#{publisherGuiInfo.name}"/>
						</h:commandButton>
						<h:commandButton value="#{web.text.CLONE}"
										 action="clonepublisherpage"
										 rendered="#{listPublishers.hasEditRights}">
							<f:setPropertyActionListener
									target="#{listPublishers.selectedPublisherName}"
									value="#{publisherGuiInfo.name}"/>
							<f:setPropertyActionListener
									target="#{listPublishers.newPublisherName}" value=""/>
						</h:commandButton>
                        <h:commandButton value="#{web.text.DELETE}"
                                         action="deletepublisherpage"
                                         rendered="#{listPublishers.hasEditRights}">
                            <f:setPropertyActionListener
                                    target="#{listPublishers.selectedPublisherName}"
                                    value="#{publisherGuiInfo.name}"/>
                        </h:commandButton>
					</div>
				</p:column>
			</p:dataTable>

            <h:panelGrid rendered="#{listPublishers.hasEditRights}" styleClass="no-border no-padding row-padding-bottom-1-rem">
                <h:outputText value="#{web.text.PUBLISHERS_NOT_CONFIGURED}"
                              rendered="#{listPublishers.aliasListEmpty}"
                              styleClass="inline-block padding-top-1-rem"/>
                <h:panelGroup>
                    <h:commandButton id="addButton" name="addButton"
                                     value="#{web.text.ADD}"
                                     action="#{listPublishers.addPublisher}"/>
                </h:panelGroup>
            </h:panelGrid>
		</h:form>
	</ui:define>
</ui:composition>
</body>
</html>
