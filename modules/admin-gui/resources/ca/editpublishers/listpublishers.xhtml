<body>
<ui:composition template="/WEB-INF/include/template.xhtml">
 	<ui:param name="resourceBean" value="#{listPublishers}" />
	<ui:define name="content">
		<h1>
			<h:outputText value="#{web.text.MANAGEPUBLISHERS}" />
		</h1>

		<h3>
			<h:outputText value="#{web.text.LISTOFPUBLISHERS}" />
		</h3>
		<h:form id="listPublishers">
			<p:dataTable value="#{listPublishers.publisherGuiList}"
						 var="publisherGuiInfo"
						 styleClass="grid"
						 columnClasses=",gridCenter,gridCenter,gridCenter"
						 paginator="true" paginatorPosition="bottom"
						 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
						 currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} publishers"
						 rowsPerPageTemplate="50,100,{ShowAll|'All'}"
			>
				<p:column rendered="false">
					<h:selectBooleanCheckbox value="#{listPublishers.selectedPublisherName}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="#{web.text.NAME}"/>
					</f:facet>
					<h:outputText value="#{publisherGuiInfo.name}"/>
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="#{web.text.TYPE}" />
					</f:facet>
					<h:outputText value="#{publisherGuiInfo.type}" />
				</p:column>

				<p:column style="width: 5%">
					<f:facet name="header">
						<h:outputText value="#{web.text.VIEW}"/>
					</f:facet>
					<p:commandButton icon="pi pi-file-edit" styleClass="rounded-button"
									 title="#{web.text.VIEW}" ajax="fasle"
									 action="#{listPublishers.viewPublisher}">
						<f:setPropertyActionListener
								target="#{listPublishers.selectedPublisherName}"
								value="#{publisherGuiInfo.name}" />
					</p:commandButton>
				</p:column>

				<p:column style="width: 5%">
					<f:facet name="header">
						<h:outputText value="#{web.text.EDIT}"/>
					</f:facet>
					<p:commandButton icon="pi pi-file-edit" styleClass="rounded-button"
									 title="#{web.text.EDIT}"
									 action="#{listPublishers.editPublisher}"
									 rendered="#{listPublishers.hasEditRights}">
						<f:setPropertyActionListener
								target="#{listPublishers.selectedPublisherName}"
								value="#{publisherGuiInfo.name}" />
					</p:commandButton>
				</p:column>

				<p:column style="width: 5%">
					<f:facet name="header">
						<h:outputText value="#{web.text.DELETE}"/>
					</f:facet>
					<p:commandButton id="actionDelete" icon="pi pi-trash" styleClass="rounded-button"
									 title="#{web.text.DELETE}"
									 action="deletepublisherpage"
									 rendered="#{listPublishers.hasEditRights}">
						<f:setPropertyActionListener
								target="#{listPublishers.selectedPublisherName}"
								value="#{publisherGuiInfo.name}" />
					</p:commandButton>
				</p:column>

				<p:column style="width: 5%">
					<f:facet name="header">
						<h:outputText value="#{web.text.CLONE}"/>
					</f:facet>
					<p:commandButton id="actionClone" icon="pi pi-clone" styleClass="rounded-button"
									 title="#{web.text.CLONE}"
									 action="clonepublisherpage"
									 rendered="#{listPublishers.hasEditRights}">
						<f:setPropertyActionListener
								target="#{listPublishers.selectedPublisherName}"
								value="#{publisherGuiInfo.name}" />
						<f:setPropertyActionListener
								target="#{listPublishers.newPublisherName}" value="" />
					</p:commandButton>
				</p:column>

			</p:dataTable>

			<p:panelGrid columns="1" styleClass="actions margin-top ui-noborder" width="100%" rendered="#{estConfigMBean.authorizedToEdit}">
				<h:panelGroup>
					<p:commandButton id="addButton" name="addButton"
									 action="#{listPublishers.addPublisher}"
									 value="#{web.text.ADD}"
					/>
				</h:panelGroup>
			</p:panelGrid>

		</h:form>
	</ui:define>
</ui:composition>
</body>
</html>
