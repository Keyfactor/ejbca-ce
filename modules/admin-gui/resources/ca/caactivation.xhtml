      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/include/template.xhtml">
    <ui:param name="resourceBean" value="#{cAActivationMBean}"/>
    <ui:define name="content">
        <h1>
            <h:outputText value="#{web.text.ACTIVATECAS}"/>
        </h1>
        <h:form id="caActivation">
            <p:dataTable value="#{cAActivationMBean.authorizedTokensAndCas}" var="tokenAndCa"
                         styleClass="grid table-layout-auto vertical-padding-1"
                         stripedRows="true" showGridlines="true">
                <p:column styleClass="table-title-column">
                    <f:facet name="header">
                        <h:panelGroup>
                            <h:outputText value="#{web.text.CRYPTOTOKEN}"/>&nbsp;<h:outputText
                                value="#{web.text.ACTIVATECAS_NAME}"/>
                        </h:panelGroup>
                    </f:facet>
                    <h:outputText rendered="#{tokenAndCa.first &amp;&amp; tokenAndCa.cryptoToken.existing}" value="#{tokenAndCa.cryptoToken.cryptoTokenName}"/>
                    <h:outputText rendered="#{!tokenAndCa.first}" value="#{tokenAndCa.cryptoToken.cryptoTokenName}"/>
                    <h:outputText rendered="#{!tokenAndCa.cryptoToken.existing}" style="font-style: italic;"
                                  value="#{web.text.ACTIVATECAS_NA}"/>
                </p:column>
                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:panelGroup>
                            <h:outputText value="#{web.text.CRYPTOTOKEN}"/>&nbsp;<h:outputText
                                value="#{web.text.ACTIVATECAS_STATE}*"/>
                        </h:panelGroup>
                    </f:facet>
                    <h:graphicImage rendered="#{tokenAndCa.cryptoToken.cryptoTokenActive}"
                                    url="/images/status-ca-active.png" styleClass="status"/>
                    <h:graphicImage rendered="#{!tokenAndCa.cryptoToken.cryptoTokenActive}"
                                    url="/images/status-ca-offline.png" styleClass="status"/>
                    <h:outputText value="#{web.text.ACTIVE}" rendered="#{tokenAndCa.cryptoToken.cryptoTokenActive}"/>
                    <h:outputText value="#{web.text.OFFLINE}" rendered="#{!tokenAndCa.cryptoToken.cryptoTokenActive}"/>
                </p:column>
                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:panelGroup>
                            <h:outputText value="#{web.text.CRYPTOTOKEN}"/>&nbsp;<h:outputText
                                value="#{web.text.ACTIVATECAS_ACTION}"/>
                        </h:panelGroup>
                    </f:facet>
                    <h:panelGroup rendered="#{tokenAndCa.first}">
                        <p:selectBooleanCheckbox id="ctKeepActive" value="#{tokenAndCa.cryptoToken.cryptoTokenNewState}" disabled="#{tokenAndCa.cryptoToken.stateChangeDisabled}"/>
                        <p:outputLabel for="ctKeepActive" value="#{web.text.ACTIVATECAS_KEEPACT}" rendered="#{tokenAndCa.cryptoToken.cryptoTokenActive}"/>
                        <p:outputLabel for="ctKeepActive" value="#{web.text.ACTIVATE}" rendered="#{!tokenAndCa.cryptoToken.cryptoTokenActive}"/>
                    </h:panelGroup>
                    <h:outputText rendered="#{!tokenAndCa.first}" escape="false" value=""/>
                </p:column>
                <p:column styleClass="table-title-column">
                    <f:facet name="header">
                        <h:panelGroup>
                            <h:outputText value="#{web.text.CA}"/>&nbsp;<h:outputText
                                value="#{web.text.ACTIVATECAS_NAME}"/>
                        </h:panelGroup>
                    </f:facet>
                    <h:outputText value="#{tokenAndCa.ca.name}"/>
                </p:column>
                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:panelGroup>
                            <h:outputText value="#{web.text.CA}"/>&nbsp;<h:outputText
                                value="#{web.text.ACTIVATECAS_SSTATE}"/>
                        </h:panelGroup>
                    </f:facet>
                    <h:graphicImage rendered="#{tokenAndCa.ca.active}" url="/images/status-ca-active.png" styleClass="status"/>
                    <h:graphicImage rendered="#{!tokenAndCa.ca.active}" url="/images/status-ca-offline.png" styleClass="status"/>
                    <h:outputText value="#{web.text.ACTIVE}" rendered="#{tokenAndCa.ca.active}"/>
                    <h:outputText value="#{web.text.EXPIRED}" rendered="#{tokenAndCa.ca.expired}"/>
                    <h:outputText value="#{web.text.REVOKED}" rendered="#{tokenAndCa.ca.revoked}"/>
                    <h:outputText value="#{web.text.OFFLINE}"
                                  rendered="#{!tokenAndCa.ca.active &amp;&amp; !tokenAndCa.ca.expired &amp;&amp; !tokenAndCa.ca.revoked}"/>
                </p:column>
                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:panelGroup>
                            <h:outputText value="#{web.text.CA}"/>&nbsp;<h:outputText
                                value="#{web.text.ACTIVATECAS_SACTION}"/>
                        </h:panelGroup>
                    </f:facet>
                    <h:panelGroup>
                        <p:selectBooleanCheckbox id="keepActive" value="#{tokenAndCa.ca.newState}" disabled="#{tokenAndCa.ca.unableToChangeState or !cAActivationMBean.authorizedToBasicFunctions}"/>
                        <p:outputLabel for="keepActive" value="#{web.text.ACTIVATECAS_KEEPACT}" rendered="#{tokenAndCa.ca.active}"/>
                        <p:outputLabel for="keepActive" value="#{web.text.ACTIVATE}" rendered="#{!tokenAndCa.ca.active}"/>
                    </h:panelGroup>
                </p:column>
                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:panelGroup>
                            <h:outputText value="#{web.text.CA}"/>&nbsp;<h:outputText
                                value="#{web.text.ACTIVATECAS_MONITORED}"/>
                        </h:panelGroup>
                    </f:facet>
                    <h:panelGroup>
                        <p:selectBooleanCheckbox id="healthCheck" value="#{tokenAndCa.ca.monitoredNewState}" disabled="#{(!tokenAndCa.ca.monitoredNewState and !tokenAndCa.cryptoToken.existing) or !cAActivationMBean.authorizedToBasicFunctions}"/>
                        <p:outputLabel for="healthCheck" value="#{web.text.ACTIVATECAS_HCHECK}"/>
                    </h:panelGroup>
                </p:column>
                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.ACTIONS}"/>
                    </f:facet>
                    <div class="action-buttons">
                        <h:commandButton rendered="#{tokenAndCa.first &amp;&amp; tokenAndCa.cryptoToken.existing}"
                                         value="#{web.text.VIEW} #{web.text.CRYPTOTOKEN}" ajax="false"
                                         action="#{cAActivationMBean.getCryptoTokenViewLink(tokenAndCa.cryptoToken.cryptoTokenId)}"
                                         icon="pi pi-file-search" styleClass="rounded-button"/>
                    </div>
                </p:column>
                <f:facet name="footer">
                    <h:outputText value="* #{web.text.ACTIVATECAS_FOOTNOTE} (#{web.ejbcaWebBean.hostName})."/>
                </f:facet>
            </p:dataTable>
            <h:panelGrid columns="3">
                <p:outputLabel rendered="#{cAActivationMBean.activationCodeShown}" for="authCode"
                               value="#{web.text.ACTIVATECAS_ACTCODE}:" styleClass="alignmiddle"/>
                <h:inputSecret rendered="#{cAActivationMBean.activationCodeShown}" id="authCode"
                               value="#{cAActivationMBean.authenticationCode}">
                    <f:passThroughAttribute name="autocomplete" value="new-password"/>
                </h:inputSecret>
                <h:commandButton id="applyButton" action="#{cAActivationMBean.applyChanges}" value="#{web.text.APPLY}"
                                 rendered="#{cAActivationMBean.authorizedToBasicFunctions }"/>
            </h:panelGrid>
        </h:form>
    </ui:define>
</ui:composition>
</html>
