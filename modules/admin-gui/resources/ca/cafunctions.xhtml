<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/include/template.xhtml">
    <ui:param name="resourceBean" value="#{cAFunctionsMBean}"/>
    <ui:define name="content">
        <h1>
            <h:outputText value="#{web.text.CASTRUCTUREANDCRL}"/>
        </h1>
        <h:panelGroup rendered="#{cAFunctionsMBean.extCaNameList.size()>0}">
            <h2>
                <h:outputText value="#{web.text.IMPORTCRL_TITLE}"/>
            </h2>
            <h:form id="importCrl" enctype='multipart/form-data'>

                <h:outputText value="#{web.text.IMPORTCRL_FUNCTION}"/>
                <input type="hidden" name='action' value='actionimportcrl'/>
                <table class="action" width="70%" border="0" cellspacing="3" cellpadding="3">
                    <tr>
                        <td width="20%" valign="top" align="right">
                            <h:outputText
                                    value="#{web.text.IMPORTCRL_FUNCTION}"/>
                        </td>

                        <td width="35%" valign="top">
                            <h:inputFile id="fileimportcrl" value="#{cAFunctionsMBean.uploadFile}"/>
                        </td>
                        <td width="35%" valign="top">
                            <h:selectOneMenu id="selectcaimportcrl"
                                             value="#{cAFunctionsMBean.crlImportCaName}">
                                <f:selectItems value="#{cAFunctionsMBean.extCaNameSeletItemList}"/>
                            </h:selectOneMenu>
                        </td>

                        <td width="10%" valign="top">
                            <h:commandButton name="buttonimportcrl" action="#{cAFunctionsMBean.uploadCrlFile}"
                                             value="#{web.text.IMPORT}">
                            </h:commandButton>
                        </td>
                    </tr>
                </table>
            </h:form>

        </h:panelGroup>
        <h2>
            <h:outputText value="#{web.text.BASICFUNCTIONS_TITLE}"/>
        </h2>

        <p:dataTable id="caFunctions"
                     value="#{cAFunctionsMBean.getCaInfos()}"
                     var="caGuiInfo"
                     styleClass="grid table-layout-auto vertical-padding-1"
                     stripedRows="true"
                     showGridlines="true">
            <p:column styleClass="table-title-column ui-md-2">
                <f:facet name="header"><h:outputText value="#{web.text.CANAME}"/></f:facet>
                <h:outputText value="#{caGuiInfo.name}"/>
            </p:column>
            <p:column styleClass="text-align-center ui-md-1">
                <f:facet name="header"><h:outputText value="#{web.text.ACTIONS}"/></f:facet>
                <div class="action-buttons">
                    <h:commandButton id="viewcacert"
                                     onclick="window.open('#{cAFunctionsMBean.getCertificatePopupLink(caGuiInfo.caId)}', 'view_cert','height=750,width=750,scrollbars=yes,toolbar=no,resizable=1').focus();"
                                     value="#{web.text.VIEW_CERTIFICATE}"
                                     title="#{web.text.VIEW_CACERTIFICATE_TITLE} #{web.text.POPUP_WINDOW}"/>

                    <h:commandButton id="viewcainfo"
                                     action="#{cAFunctionsMBean.openCertificateInfoPopup}"
                                     onclick="window.open('#{cAFunctionsMBean.openCertificateInfoPopup(caGuiInfo.caId)}', 'view_cert','height=750,width=750,scrollbars=yes,toolbar=no,resizable=1').focus();"
                                     value="#{web.text.VIEW_INFORMATION}"
                                     title="#{web.text.VIEW_CAINFORMATION_TITLE} #{web.text.POPUP_WINDOW}"/>
                </div>
            </p:column>
            <p:column styleClass="text-align-center verticalAlignTop ui-md-5">
                <f:facet name="header"><h:outputText value="#{web.text.CERTIFICATECHAINDETAILS_TITLE}"/></f:facet>
                <!-- DETAILS CHAIN TABLE START -->
                <p:dataTable id="certChainDetails" value="#{caGuiInfo.certificatechain}"
                             var="certificatechain"
                             binding="#{table}"
                             styleClass="grid table-layout-auto vertical-padding-1"
                             stripedRows="true" showGridlines="true">
                    <p:column styleClass="table-title-column text-align-left ui-md-6">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.TYPE}"/>
                        </f:facet>
                        <h:outputText value="#{web.text.ROOTCA}:"
                                      rendered="#{certificatechain.isRoot() and table.rowIndex == 0}"/>
                        <h:outputText value="#{web.text.ISSUINGCA}:"
                                      rendered="#{!certificatechain.isRoot() and table.rowIndex == 0}"/>
                        <h:outputText value="#{web.text.SUBORDINATECA} #{table.rowIndex}: "
                                      rendered="#{table.rowIndex > 0}"/>
                        <h:outputText value=" #{certificatechain.getSubjectDN()}" style="font-weight:normal;"/>
                    </p:column>
                    <p:column styleClass="text-align-center ui-md-6">
                        <f:facet name="header"><h:outputText value="#{web.text.ACTIONS}"/></f:facet>

                        <p:row rendered="#{table.rowIndex == 0}">
                            <ui:fragment rendered="#{certificatechain.certExists}">
                                <h:form enctype="multipart/form-data">
                                    <div class="action-buttons">
                                        <h:commandButton id="downloadBinary"
                                                         value="#{web.text.DOWNLOADIE}" ajax="false"
                                                         icon="pi pi-file-edit" styleClass="rounded-button"
                                                         action="#{cAFunctionsMBean.prepareDownloadCertificate('iecacert',table.rowCount - table.rowIndex - 1,caGuiInfo.escapedSubjectDn)}"
                                        />
                                        <h:commandButton id="downloadFirefox"
                                                         value="#{web.text.DOWNLOADNS}" ajax="false"
                                                         icon="pi pi-file-edit" styleClass="rounded-button"
                                                         action="#{cAFunctionsMBean.prepareDownloadCertificate('nscacert',table.rowCount - table.rowIndex - 1,caGuiInfo.escapedSubjectDn)}"
                                        />
                                        <h:commandButton id="downloadPEM"
                                                         value="#{web.text.DOWNLOADPEM}" ajax="false"
                                                         icon="pi pi-file-edit" styleClass="rounded-button"
                                                         action="#{cAFunctionsMBean.prepareDownloadCertificate('cacert',table.rowCount - table.rowIndex - 1,caGuiInfo.escapedSubjectDn)}"
                                        />
                                        <h:commandButton id="downloadJKS"
                                                         value="#{web.text.DOWNLOADJKS}"
                                                         icon="pi pi-file-edit" styleClass="rounded-button"
                                                         action="#{cAFunctionsMBean.showJksDownloadForm(caGuiInfo, (table.rowCount - table.rowIndex - 1))}"
                                        />

                                        <h:commandButton rendered="#{caGuiInfo.caType == 'SSHCA'}"
                                                         id="downloadSSH"
                                                         value="#{web.text.DOWNLOADSSH}" ajax="false"
                                                         icon="pi pi-file-edit" styleClass="rounded-button"
                                                         action="#{cAFunctionsMBean.prepareDownloadSshPublicKey(table.rowCount - table.rowIndex - 1, caGuiInfo.escapedName)}"
                                        />
                                    </div>
                                </h:form>
                            </ui:fragment>
                        </p:row>

                        <p:row rendered="#{table.rowIndex != 0}">
                            <h:form enctype="multipart/form-data">
                                <div class="action-buttons">
                                    <h:commandButton id="downloadBinary"
                                                     value="#{web.text.DOWNLOADIE}" ajax="false"
                                                     icon="pi pi-file-edit" styleClass="rounded-button"
                                                     action="#{cAFunctionsMBean.prepareDownloadCertificate('iecacert',table.rowCount - table.rowIndex - 1,caGuiInfo.escapedSubjectDn)}"
                                    />
                                    <h:commandButton id="downloadFirefox"
                                                     value="#{web.text.DOWNLOADNS}" ajax="false"
                                                     icon="pi pi-file-edit" styleClass="rounded-button"
                                                     action="#{cAFunctionsMBean.prepareDownloadCertificate('nscacert',table.rowCount - table.rowIndex - 1,caGuiInfo.escapedSubjectDn)}"
                                    />
                                    <h:commandButton id="downloadPEM"
                                                     value="#{web.text.DOWNLOADPEM}" ajax="false"
                                                     icon="pi pi-file-edit" styleClass="rounded-button"
                                                     action="#{cAFunctionsMBean.prepareDownloadCertificate('cacert',table.rowCount - table.rowIndex - 1,caGuiInfo.escapedSubjectDn)}"
                                    />
                                    <h:commandButton id="downloadJKS"
                                                     value="#{web.text.DOWNLOADJKS}"
                                                     icon="pi pi-file-edit" styleClass="rounded-button"
                                                     action="#{cAFunctionsMBean.showJksDownloadForm(caGuiInfo, (table.rowCount - table.rowIndex - 1))}"
                                    />
                                </div>
                            </h:form>
                        </p:row>
                        <p:row rendered="#{caGuiInfo.isShowJksDownloadForm(table.rowCount - table.rowIndex - 1)}">
                            <div class="action-buttons">
                                <form method="post"
                                      action="#{cAFunctionsMBean.getDownloadCertificateLink()}">
                                    <input type="hidden"
                                           name="cmd"
                                           value="jkscert"/>
                                    <input type="hidden"
                                           name="level"
                                           value="#{table.rowCount - table.rowIndex - 1}"/>
                                    <input type="hidden"
                                           name="issuer"
                                           value="#{caGuiInfo.subjectdn}"/>
                                    <h:outputText value="#{web.text.JKSPASSWORD}"/>
                                    <input type="password"
                                           name="password"
                                           value=""/>
                                    <input type="submit"
                                           value="#{web.text.DOWNLOADJKS}"/>
                                </form>
                            </div>
                        </p:row>
                    </p:column>
                </p:dataTable>
                <!-- DETAILS CHAIN TABLE END -->
            </p:column>
            <p:column styleClass="text-align-center verticalAlignTop ui-md-4">
                <f:facet name="header">
                    <h:outputText value="#{web.text.CRL_DETAILS}"/>
                </f:facet>

                <!-- CRL UNSUPPORTED MESSAGE -->
                <ui:fragment rendered="#{!caGuiInfo.isCrlSupported()}">
                    <h:outputText value="#{web.text.CRL_UNSUPPORTED}"/>
                </ui:fragment>

                <!-- CRL NOT GENERATED MESSAGE -->
                <ui:fragment rendered="#{caGuiInfo.isCrlInfoEmpty()}">
                    <h:outputText value="#{web.text.NOCRLHAVEBEENGENERATED}"/>
                </ui:fragment>

                <!-- FULL CRLs -->
                <ui:fragment rendered="#{caGuiInfo.isCrlSupported()}">
                    <h4 class="text-align-left margin-bottom">
                        <h:outputText value="#{web.text.LATESTCRL}:" rendered="#{!caGuiInfo.isCrlInfoEmpty()}"/>
                    </h4>

                    <p:dataTable id="crlInfo"
                                 value="#{caGuiInfo.getCrlinfo()}"
                                 var="crlInfo"
                                 rendered="#{!caGuiInfo.isCrlInfoEmpty()}"
                                 styleClass="grid table-layout-auto vertical-padding-1"
                                 stripedRows="true"
                                 showGridlines="true"
                    >
                        <p:column styleClass="text-align-center">
                            <f:facet name="header">
                                <h:outputText value="#{web.text.CREATED}"/>
                            </f:facet>
                            <h:outputText value="#{crlInfo.crlCreateDate}"/>
                        </p:column>
                        <p:column styleClass="text-align-center">
                            <f:facet name="header">
                                <h:outputText value="#{web.text.EXPIRES}"/>
                            </f:facet>
                            <h:panelGroup rendered="#{crlInfo.crlExpired}">
						        <span id="alert">
							        <h:outputText value=" #{crlInfo.crlExpireDate}"/>
						        </span>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{!crlInfo.crlExpired}">
						        <span id="alert2">
							        <h:outputText value=" #{crlInfo.crlExpireDate}"/>
						        </span>
                            </h:panelGroup>
                        </p:column>
                        <p:column styleClass="text-align-center">
                            <f:facet name="header">
                                <h:outputText value="#{web.text.PARTITION}"/>
                            </f:facet>
                            <h:outputText value="#{crlInfo.partitionIndex}"/>
                        </p:column>
                        <p:column styleClass="text-align-center">
                            <f:facet name="header">
                                <h:outputText value="#{web.text.NUMBER}"/>
                            </f:facet>
                            <h:outputText value=" #{crlInfo.lastCrlNumber}"/>
                        </p:column>
                        <p:column styleClass="text-align-center">
                            <f:facet name="header">
                                <h:outputText value="#{web.text.ACTIONS}"/>
                            </f:facet>
                            <div class="action-buttons">
                                <h:form>
                                    <h:commandButton rendered="#{!caGuiInfo.displayPartitions}" id="getCRL"
                                                     value="#{web.text.GETCRL}" ajax="false"
                                                     icon="pi pi-search" styleClass="rounded-button"
                                                     action="#{cAFunctionsMBean.prepareDownloadCrlLink(crlInfo.URLEncodedSubjectDn)}"/>
                                    <h:commandButton rendered="#{caGuiInfo.displayPartitions}" id="getPartitionCRL"
                                                     value="#{web.text.GETCRL}" ajax="false"
                                                     icon="pi pi-search" styleClass="rounded-button"
                                                     action="#{cAFunctionsMBean.prepareDownloadCrlLinkPartition(crlInfo.URLEncodedSubjectDn, crlInfo.partitionIndex)}"/>
                                </h:form>
                            </div>
                        </p:column>
                    </p:dataTable>

                    <!-- Delta CRLs-->
                    <h:panelGroup rendered="#{caGuiInfo.isDeltaCrlInfoEmpty()}">
                        <h:outputText value="#{web.text.NODELTACRLHAVEBEENGENERATED}"
                                      rendered="#{caGuiInfo.getDeltaPeriodEnabled()}" styleClass="display-block margin-top-1-rem"/>
                        <h:outputText value="#{web.text.DELTACRLSNOTENABLED}"
                                      rendered="#{!caGuiInfo.getDeltaPeriodEnabled()}" styleClass="display-block margin-top-1-rem"/>
                    </h:panelGroup>

                    <h4 class="text-align-left margin-top-1-rem">
                        <h:outputText value="#{web.text.LATESTDELTACRL}:"
                                      rendered="#{!caGuiInfo.isDeltaCrlInfoEmpty()}"/>
                    </h4>

                    <p:panelGrid rendered="#{!caGuiInfo.isDeltaCrlInfoEmpty()}" columns="2"
                                 columnClasses="ui-md-3,ui-md-4" id="crlDeltaInfo">
                        <p:row>
                            <p:column styleClass="ui-column-title text-align-left">
                                <b><h:outputText value="#{web.text.CREATED}:"/></b>
                            </p:column>
                            <p:column styleClass="text-align-left">
                                <h:outputText value="#{caGuiInfo.getDeltaCrlCreateDate()}"/>
                            </p:column>
                        </p:row>
                        <p:row rendered="#{caGuiInfo.isDeltaCrlExpired()}">
                            <p:column styleClass="ui-column-title text-align-left">
                                <b><h:outputText value="#{web.text.EXPIRED}:"/></b>
                            </p:column>
                            <p:column styleClass="text-align-left">
                                <span id="alert3"><h:outputText value="#{caGuiInfo.getDeltaCrlExpireDate()}"/></span>
                            </p:column>
                        </p:row>
                        <p:row rendered="#{caGuiInfo.isDeltaCrlExpired()}">
                            <p:column styleClass="ui-column-title text-align-left">
                                <b><h:outputText value="#{web.text.NUMBER}:"/></b>
                            </p:column>
                            <p:column styleClass="text-align-left">
                                <h:outputText value="#{caGuiInfo.deltacrlinfo.getLastCRLNumber()}"/>
                            </p:column>
                        </p:row>

                        <p:row rendered="#{!caGuiInfo.isDeltaCrlExpired()}">
                            <p:column styleClass="ui-column-title text-align-left">
                                <b><h:outputText value="#{web.text.EXPIRES}:"/></b>
                            </p:column>
                            <p:column styleClass="text-align-left">
                                <span id="alert4"><h:outputText value="#{caGuiInfo.getDeltaCrlExpireDate()}"/></span>
                            </p:column>
                        </p:row>
                        <p:row rendered="#{!caGuiInfo.isDeltaCrlExpired()}">
                            <p:column styleClass="ui-column-title text-align-left">
                                <b><h:outputText value="#{web.text.NUMBER}:"/></b>
                            </p:column>
                            <p:column styleClass="text-align-left">
                                <h:outputText value="#{caGuiInfo.deltacrlinfo.getLastCRLNumber()}"/>
                            </p:column>
                        </p:row>
                        <p:row rendered="#{!caGuiInfo.isDeltaCrlExpired()}">
                            <p:column colspan="2" styleClass="text-align-left">
                                <h:outputLink
                                        value="#{cAFunctionsMBean.getDownloadCrlLink()}?cmd=deltacrl&amp;issuer=#{caGuiInfo.subjectdn}">
                                    <h:outputText value="#{web.text.GETDELTACRL}"/>
                                </h:outputLink>
                            </p:column>
                        </p:row>
                    </p:panelGrid>
                    <!--Display createcrl if admin is authorized-->
                    <div class="text-alight-right">
                        <h:form>
                            <h:panelGroup rendered="#{cAFunctionsMBean.hasCreatecrlrights()}">
                                <h:outputText value="#{web.text.CREATENEWCRL}: "/>
                                <h:commandButton name="buttoncreatecrl"
                                                 value="#{web.text.CREATECRL}"
                                                 rendered="#{caGuiInfo.caStatusActive}"
                                                 action="#{cAFunctionsMBean.createNewCrl(caGuiInfo.caId)}"/>
                                <h:outputText value="#{web.text.CAISNTACTIVE}"
                                              rendered="#{!caGuiInfo.caStatusActive}"/>
                                <br/>
                                <h:panelGroup rendered="#{caGuiInfo.deltaPeriodEnabled}" styleClass="display-block margin-top-1-rem">
                                    <h:outputText value="#{web.text.CREATENEWDELTACRL}: "/>
                                    <h:commandButton name="buttoncreatecrl"
                                                     value="#{web.text.CREATECRL}"
                                                     rendered="#{caGuiInfo.caStatusActive}"
                                                     action="#{cAFunctionsMBean.createNewDeltaCrl(caGuiInfo.caId)}"/>
                                    <h:outputText value="#{web.text.CAISNTACTIVE}"
                                                  rendered="#{!caGuiInfo.caStatusActive}"/>
                                </h:panelGroup>
                            </h:panelGroup>
                        </h:form>
                    </div>
                </ui:fragment>
            </p:column>
        </p:dataTable>
    </ui:define>
</ui:composition>
</html>
