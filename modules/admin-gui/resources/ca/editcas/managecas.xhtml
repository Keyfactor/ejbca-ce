      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"

<ui:composition template="/WEB-INF/include/template.xhtml">
    <ui:param name="resourceBean" value="#{manageCAsMBean}"/>
    <ui:define name="content">
        <h1>
            <h:outputText value="#{web.text.MANAGECAS}"/>
            <h:outputText
                    value="#{web.ejbcaWebBean.getHelpReference('/Managing_CAs.html')}"
                    escape="false" styleClass="helpReference"/>
        </h1>

        <h:form id="managecas" enctype="multipart/form-data">
            <h:panelGroup>
                <h3>
                    <h:outputText value="#{web.text.LISTOFCAS}"/>
                </h3>
                <p:dataTable value="#{manageCAsMBean.canames}" var="caname"
                             styleClass="grid table-layout-auto vertical-padding-1"
                             stripedRows="true" showGridlines="true">
                    <p:column styleClass="table-title-column">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.NAME}"/>
                        </f:facet>
                        <h:outputText value="#{caname}" title="#{caname}"/>
                    </p:column>
                    <p:column styleClass="text-align-center">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.TYPE}"/>
                        </f:facet>
                        <h:outputText value="#{manageCAsMBean.getType(caname)}"/>
                    </p:column>
                    <p:column styleClass="text-align-center">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.STATUS}"/>
                        </f:facet>
                        <h:outputText value="#{manageCAsMBean.getStatus(caname)}"/>
                    </p:column>
                    <p:column styleClass="text-align-center">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.ACTIONS}"/>
                        </f:facet>
                        <div class="action-buttons">
                            <h:commandButton
                                    value="#{web.text.VIEW}" ajax="false"
                                    icon="pi pi-search" styleClass="rounded-button"
                                    action="#{manageCAsMBean.viewCaPage(caname)}"/>
                            <h:commandButton value="#{web.text.EDIT}" ajax="false"
                                             action="#{manageCAsMBean.editCaPage(caname)}"
                                             icon="pi pi-file-edit" styleClass="rounded-button"
                                             rendered="#{manageCAsMBean.canEditResource}"/>
                            <h:commandButton value="#{web.text.DELETE}" ajax="false"
                                             action="#{manageCAsMBean.deleteCA(caname)}"
                                             icon="pi pi-trash" styleClass="rounded-button"
                                             rendered="#{manageCAsMBean.canRemoveResource}"/>
                            <h:commandButton value="#{web.text.CREATEAUTHCSR}" ajax="false"
                                             rendered="#{manageCAsMBean.canRenewResource}"
                                             icon="pi pi-clone" styleClass="rounded-button"
                                             action="#{manageCAsMBean.createAuthCertSignRequest(caname)}"/>
                        </div>
                    </p:column>
                </p:dataTable>
                <div class="action-buttons">
                    <h:panelGroup
                            rendered="#{ejbcawebbean.runningBuildWithCA and manageCAsMBean.canAddAndEditResource}">
                        <h:commandButton id="buttoncreateca"
                                         value="#{web.text.ADD}" ajax="false"
                                         rendered="#{manageCAsMBean.canAddResource}"
                                         action="#{manageCAsMBean.createCaPage}"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{ejbcawebbean.runningBuildWithCA}">
                        <h:commandButton
                                id="buttonimportca" ajax="false"
                                value="#{manageCAsMBean.importKeystoreText}"
                                rendered="#{manageCAsMBean.canAddResource}"
                                action="importca"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <h:commandButton
                                id="buttonimportcacert" ajax="false"
                                value="#{manageCAsMBean.importCertificateText}"
                                rendered="#{manageCAsMBean.canAddResource}"
                                action="importcacert"/>
                    </h:panelGroup>
                </div>
            </h:panelGroup>
            <h3 class="vertical-padding-1">
                <h:outputText value="#{web.text.IMPORT_CERTIFICATE_BUNDLE}"
                              rendered="#{manageCAsMBean.canAddResource}"/>
            </h3>
            <h:panelGroup rendered="#{manageCAsMBean.canAddResource}">
                <h:outputLabel for="importCertificateBundle" value="#{web.text.SELECT_CERTIFICATE_BUNDLE}"
                               styleClass="break-line no-padding padding-bottom-1-rem"/>
                <h:inputFile value="#{manageCAsMBean.certificateBundle}" id="importCertificateBundle">
                    <f:ajax render="@all" listener="#{manageCAsMBean.importCertificateBundle}"/>
                </h:inputFile>
            </h:panelGroup>
        </h:form>
    </ui:define>
</ui:composition>
</html>
