<ui:composition template="/WEB-INF/include/template.xhtml">
    <ui:param name="resourceBean" value="#{manageCAsMBean}"/>
    <ui:define name="content">
        
        
        <h1>
        <h:outputText value="#{web.text.CA_PAGE_TITLE}"/>
    </h1>
        
        <p:tabView id="tabs" dynamic="true" activeIndex="#{manageCAsMBean.lastActiveTab}">
        <p:ajax event="tabChange" listener="#{manageCAsMBean.onTabChange}"/>

        <p:tab title="#{web.text.MANAGECAS}" >

        <h:form id="managecas" enctype="multipart/form-data">
            <h:panelGroup>
                <h3>
                    <h:outputText value="#{web.text.LISTOFCAS}"/>
                     <h:outputText
                        value="#{web.ejbcaWebBean.getHelpReference('/Managing_CAs.html')}"
                        escape="false" styleClass="helpReference"/>
                </h3>
                <p:dataTable id="calist" value="#{manageCAsMBean.canames}" var="caname"
                             rendered="#{!manageCAsMBean.caListEmpty}"
                             styleClass="grid table-layout-auto vertical-padding-1"
                             stripedRows="true" showGridlines="true">
                    <p:column styleClass="table-title-column">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.NAME}"/>
                        </f:facet>
                        <h:outputText value="#{caname}" title="#{caname}"/>
                    </p:column>
                    <p:column styleClass="text-align-center">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.TYPE}"/>
                        </f:facet>
                        <h:outputText value="#{manageCAsMBean.getType(caname)}"/>
                    </p:column>
                    <p:column styleClass="text-align-center">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.STATUS}"/>
                        </f:facet>
                        <h:outputText value="#{manageCAsMBean.getStatus(caname)}"/>
                    </p:column>
                    <p:column styleClass="text-align-center">
                        <f:facet name="header">
                            <h:outputText value="#{web.text.ACTIONS}"/>
                        </f:facet>
                        <div class="action-buttons">
                            <h:commandButton id="view"
                                    value="#{web.text.VIEW}" ajax="false"
                                    icon="pi pi-search" styleClass="rounded-button"
                                    action="#{manageCAsMBean.viewCaPage(caname)}"/>
                            <h:commandButton id="edit"
                                             value="#{web.text.EDIT}" ajax="false"
                                             action="#{manageCAsMBean.editCaPage(caname)}"
                                             icon="pi pi-file-edit" styleClass="rounded-button"
                                             rendered="#{manageCAsMBean.canEditResource}"/>
                            <h:commandButton id="createAuthenticatedCSR"
                                             value="#{web.text.CREATEAUTHCSR}" ajax="false"
                                             rendered="#{manageCAsMBean.canRenewResource}"
                                             icon="pi pi-clone" styleClass="rounded-button"
                                             action="#{manageCAsMBean.createAuthCertSignRequest(caname)}"/>
                            <h:commandButton id="delete"
                                             value="#{web.text.DELETE}" ajax="false"
                                             action="#{manageCAsMBean.deleteCA(caname)}"
                                             icon="pi pi-trash" styleClass="rounded-button"
                                             rendered="#{manageCAsMBean.canRemoveResource}"/>
                        </div>
                    </p:column>
                </p:dataTable>
                <h:panelGrid rendered="#{manageCAsMBean.canAddAndEditResource}"
                             styleClass="no-border no-padding row-padding-bottom-1-rem">
                    <h:outputText value="#{web.text.CAS_NOT_CONFIGURED }"
                                  rendered="#{manageCAsMBean.caListEmpty}"
                                  styleClass="inline-block padding-top-1-rem"/>
                    <h:panelGroup>
                        <div class="action-buttons">
                            <h:panelGroup>
                                <h:commandButton id="buttoncreateca"
                                                 value="#{web.text.ADD}" ajax="false"
                                                 rendered="#{ejbcawebbean.runningBuildWithCA and manageCAsMBean.canAddResource}"
                                                 action="#{manageCAsMBean.createCaPage}"/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{ejbcawebbean.runningBuildWithCA}">
                                <h:commandButton
                                        id="buttonimportca" ajax="false"
                                        value="#{ejbcawebbean.runningBuildWithCA and manageCAsMBean.importKeystoreText}"
                                        rendered="#{manageCAsMBean.canAddResource}"
                                        action="importca"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <h:commandButton
                                        id="buttonimportcacert" ajax="false"
                                        value="#{manageCAsMBean.importCertificateText}"
                                        rendered="#{manageCAsMBean.canEditResource}"
                                        action="importcacert"/>
                            </h:panelGroup>
                        </div>
                    </h:panelGroup>
                </h:panelGrid>
            </h:panelGroup>
            <h3 class="vertical-padding-1">
                <h:outputText value="#{web.text.IMPORT_CERTIFICATE_BUNDLE}"
                              rendered="#{manageCAsMBean.canAddResource}"/>
            </h3>
            <h:panelGroup rendered="#{manageCAsMBean.canAddResource}">
                <h:outputLabel for="importCertificateBundle" value="#{web.text.SELECT_CERTIFICATE_BUNDLE}"
                               styleClass="break-line no-padding padding-bottom-1-rem"/>
                <h:inputFile value="#{manageCAsMBean.certificateBundle}" id="importCertificateBundle">
                    <f:ajax render="@all" listener="#{manageCAsMBean.importCertificateBundle}"/>
                </h:inputFile>
            </h:panelGroup>
        </h:form>
        </p:tab>
        <p:tab title="#{web.text.CONFIGURATION}" >
            <h:form id="globalCaSettings" style="display: block;">
                <h:panelGrid columns="3" columnClasses="ui-md-4,ui-md-4,ui-md-4">
                    <!-- ICAO Name Change -->
	                <h:panelGroup>
	                    <h:outputText value="#{web.text.ENABLEICAOCANAMECHANGE}"/>              
                    </h:panelGroup>
                    <h:selectBooleanCheckbox id="enableicaocanamechange" value="#{manageCAsMBean.globalCaConfiguration.enableIcaoCANameChange}"
                        disabled="#{!manageCAsMBean.allowedToEditSystemConfiguration}">
                    </h:selectBooleanCheckbox>
                    <h:outputText value="#{web.text.CA_ICAO_NAME_CHANGE_HELP}" styleClass="smallHelp"/>
                    
                   
                    <!-- CA Certificate Cache Time -->
                    <h:panelGroup>
                     <h:outputText value="#{web.text.CA_CERTIFICATE_CACHE_TIME}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <h:inputText disabled="#{!manageCAsMBean.allowedToEditSystemConfiguration}" value="#{manageCAsMBean.globalCaConfiguration.caCertificateCacheTimeSeconds}"
                            styleClass="ui-md-11" id="caCertificateCacheTime">
                            <f:converter converterId="jakarta.faces.Long"/>
                        </h:inputText>
                    </h:panelGroup>
                    <h:outputLabel value="#{web.text.CA_CERTIFICATE_CACHE_TIME_HELP}" styleClass="smallHelp"/>
                    
                    
                     <h:panelGroup layout="block">
                        <h:commandButton action="#{manageCAsMBean.saveGlobalCaSettings}"
                                 rendered="#{manageCAsMBean.allowedToEditSystemConfiguration}"
                                 value="#{web.text.SAVE}" >
                        </h:commandButton>
                    </h:panelGroup>
                </h:panelGrid>
            </h:form>
        </p:tab>
        </p:tabView>
    </ui:define>
</ui:composition>
</html>
