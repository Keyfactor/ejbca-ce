<ui:composition template="/WEB-INF/include/template.xhtml">
    <ui:param name="resourceBean" value="#{listServicesManagedBean}"/>
    <ui:define name="content">
        <h1>
            <h:outputText
                    value="#{listServicesManagedBean.hasEditRights ? web.text.MANAGESERVICES : web.text.VIEWSERVICE}"/>
            <h:outputText value="#{web.ejbcaWebBean.getHelpReference('/Services.html')}" escape="false"/>
        </h1>
        <h:form>
            <h:panelGroup rendered="#{listServicesManagedBean.hasEditRights}">
                <h3>
                    <h:outputText value="#{web.text.CLONE}"/>
                </h3>
                <h:panelGrid columns="2">
                    <h:outputLabel for="cloneServiceTemplateName" value="#{web.text.SERVICE_CLONE_TEMPLATE}"/>
                    <h:outputText id="cloneServiceTemplateName" value="#{listServicesManagedBean.selectedServiceName}"/>
                    <h:outputLabel for="clonedServiceName" value="#{web.text.SERVICE_CLONE_NEW_NAME}"/>
                    <h:inputText id="clonedServiceName" name="textfieldalias"
                                 value="#{listServicesManagedBean.clonedServiceName}" size="40"
                                 title="#{web.text.FORMAT_ID_STR}"
                                 required="true"
                                 requiredMessage="#{web.text.YOUAREREQUIRED} #{web.text.SERVICE_CLONE_NEW_NAME}">
                        <f:converter converterId="trimConverter"/>
                    </h:inputText>
                    <h:panelGroup/>
                    <h:panelGroup styleClass="action-buttons">
                        <h:commandButton id="cloneServiceSaveButton" name="cloneServiceSaveButton"
                                         action="#{listServicesManagedBean.cloneService()}" value="#{web.text.CLONE_CONFIRM}"/>
                        <h:commandButton id="cloneServiceCancelbutton" name="cloneServiceCancelbutton"
                                         action="done" value="#{web.text.CANCEL}" immediate="true"/>
                    </h:panelGroup>
                </h:panelGrid>
            </h:panelGroup>
        </h:form>
    </ui:define>
</ui:composition>
</html>
