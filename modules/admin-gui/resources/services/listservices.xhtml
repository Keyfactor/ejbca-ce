<body>
<ui:composition template="/WEB-INF/include/template.xhtml">
    <ui:param name="resourceBean" value="#{listServicesManagedBean}"/>
    <f:metadata>
        <f:viewAction action="#{listServicesManagedBean.loadData}" />
    </f:metadata>
    <ui:define name="content">
        <h1>
            <h:outputText
                    value="#{listServicesManagedBean.hasEditRights ? web.text.MANAGESERVICES : web.text.VIEWSERVICE}"/>
            <h:outputText value="#{web.ejbcaWebBean.getHelpReference('/Services.html')}" escape="false"/>
        </h1>

        <h3 id="serviceTitle">
            <h:outputText value="#{web.text.LISTOFSERVICES}"/>
        </h3>

        <h:form id="services">
            <p:dataTable id="list-services-table" var="serviceName" value="#{listServicesManagedBean.sortedServicesList}"
                         rendered="#{!listServicesManagedBean.serviceListEmpty}"
                         styleClass="grid table-layout-auto vertical-padding-1" stripedRows="true" showGridlines="true">
                <p:column styleClass="table-title-column">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.NAME}"/>
                    </f:facet>
                    <h:outputText value="#{serviceName}" title="#{serviceName}"/>
                </p:column>
                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.TYPE}"/>
                    </f:facet>
                    <h:outputText value="#{listServicesManagedBean.getServiceType(serviceName)}"/>
                </p:column>
                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.STATUS}"/>
                    </f:facet>
                    <h:outputText value="#{listServicesManagedBean.getServiceStatus(serviceName)}"/>
                </p:column>
                <p:column styleClass="text-align-center">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.ACTIONS}"/>
                    </f:facet>
                    <div class="action-buttons">
                        <h:commandButton id="viewButton" value="#{web.text.VIEW}"
                                         action="#{listServicesManagedBean.viewService(serviceName)}"/>
                        <h:commandButton id="editButton" value="#{web.text.EDIT}"
                                         action="#{listServicesManagedBean.editService(serviceName)}"
                                         disabled="#{!listServicesManagedBean.hasEditRights}"/>
                        <h:commandButton id="cloneButton" value="#{web.text.CLONE}"
                                         rendered="#{manageCAsMBean.canRenewResource}"
                                         action="#{listServicesManagedBean.cloneService(serviceName)}"
                                         disabled="#{!listServicesManagedBean.hasEditRights}"/>
                        <h:commandButton id="deleteButton" value="#{web.text.DELETE}"
                                         action="#{listServicesManagedBean.confirmServiceDeletion(serviceName)}"
                                         disabled="#{!listServicesManagedBean.hasEditRights}"/>
                    </div>
                </p:column>
            </p:dataTable>
            <h:panelGrid rendered="#{listServicesManagedBean.hasEditRights}" styleClass="no-border no-padding padding-bottom-1-rem">
                <h:outputText value="#{web.text.SERVICES_NOT_CONFIGURED}"
                              rendered="#{listServicesManagedBean.serviceListEmpty}"
                              styleClass="inline-block padding-top-1-rem"/>
                <h:panelGroup>
                    <h:commandButton id="addButton" name="addButton"
                                     action="#{listServicesManagedBean.addService}"
                                     value="#{web.text.ADD}">
                        <f:param name="faces-redirect" value="true"/>
                        <f:param name="mode" value="edit"/>
                    </h:commandButton>
                </h:panelGroup>
            </h:panelGrid>
        </h:form>
    </ui:define>
</ui:composition>
</body>
</html>
