<body>
<ui:composition template="/WEB-INF/include/template.xhtml">
    <ui:param name="resourceBean" value="#{listServicesManagedBean}"/>
    <ui:define name="content">
        <h1>
            <h:outputText
                    value="#{listServicesManagedBean.hasEditRights ? web.text.MANAGESERVICES : web.text.VIEWSERVICE}"/>
            <h:outputText value="#{web.ejbcaWebBean.getHelpReference('/Services.html')}" escape="false"/>
        </h1>

        <h3 id="serviceTitle">
            <h:outputText value="#{web.text.LISTOFSERVICES}"/>
        </h3>

        <h:form id="services">
            <p:dataTable id="list-services-table" var="service" value="#{listServicesManagedBean.sortedServicesList}"
                         rendered="#{!listServicesManagedBean.serviceListEmpty}"
                         styleClass="grid" rows="10"
                         paginator="true" paginatorPosition="bottom" stripedRows="true" showGridlines="true"
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                         currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} services"
                         rowsPerPageTemplate="10,25,50,{ShowAll|'All'}">
                <p:column styleClass="list-services-column-name">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.NAME}"/>
                    </f:facet>
                    <h:outputText value="#{service.value}" title="#{service.value}" style="font-weight: bold"/>
                </p:column>
                <p:column styleClass="h-center-column">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.STATUS}"/>
                    </f:facet>
                    <h:outputText value="#{service.label}"/>
                </p:column>
                <p:column styleClass="h-center-column">
                    <f:facet name="header">
                        <h:outputText value="#{web.text.ACTIONS}"/>
                    </f:facet>
                    <div class="action-buttons">
                        <h:commandButton id="viewButton" value="#{web.text.VIEW}"
                                         action="#{listServicesManagedBean.viewService(service.value)}"/>
                        <h:commandButton id="editButton" value="#{web.text.EDIT}"
                                         action="#{listServicesManagedBean.editService(service.value)}"
                                         disabled="#{!listServicesManagedBean.hasEditRights}"/>
                        <h:commandButton id="deleteButton" value="#{web.text.DELETE}"
                                         action="#{listServicesManagedBean.confirmServiceDeletion(service.value)}"
                                         disabled="#{!listServicesManagedBean.hasEditRights}"/>
                        <h:commandButton id="cloneButton" value="#{web.text.CLONE}"
                                         rendered="#{manageCAsMBean.canRenewResource}"
                                         action="#{listServicesManagedBean.cloneService(service.value)}"
                                         disabled="#{!listServicesManagedBean.hasEditRights}"/>
                    </div>
                </p:column>
            </p:dataTable>
            <h:panelGrid styleClass="actions margin-top" width="100%"
                         rendered="#{listServicesManagedBean.hasEditRights}">
                <h:outputText value="#{web.text.SERVICES_NOT_CONFIGURED}"
                              rendered="#{listServicesManagedBean.serviceListEmpty}"/>
                <h:panelGroup>
                    <h:commandButton id="addButton" name="addButton"
                                     action="#{listServicesManagedBean.addService}"
                                     value="#{web.text.ADD}">
                        <f:param name="faces-redirect" value="true"/>
                        <f:param name="mode" value="edit"/>
                    </h:commandButton>
                </h:panelGroup>
            </h:panelGrid>
        </h:form>
    </ui:define>
</ui:composition>
</body>
</html>
