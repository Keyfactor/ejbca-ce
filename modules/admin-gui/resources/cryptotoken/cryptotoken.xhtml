<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<ui:remove>
    <!--
    /*************************************************************************

     *                                                                       *
     *************************************************************************/

</ui:remove>
<ui:composition template="/WEB-INF/include/template.xhtml">
    <ui:param name="resourceBean" value="#{cryptoTokenMBean}"/>
    <ui:define name="content">
        <f:metadata>
            <f:viewParam name="initNewPki" value="#{initNewPkiMBean.initNewPkiRedirect}"/>
            <f:event type="preRenderView" listener="#{cryptoTokenMBean.onload}"/>
        </f:metadata>
        <h1>
            <h:outputText value="#{web.text.CRYPTOTOKEN_NEW}"
                          rendered="#{cryptoTokenMBean.currentCryptoTokenId == 0}"/>
            <h:outputText
                    value="#{web.text.CRYPTOTOKEN}: #{cryptoTokenMBean.currentCryptoToken.name}"
                    rendered="#{cryptoTokenMBean.currentCryptoTokenId != 0}"/>
        </h1>
        <h:form id="currentCryptoTokenForm">
            <h:inputHidden value="#{cryptoTokenMBean.currentCryptoTokenEditMode}"/>
            <p:panelGrid columns="2" columnClasses="ui-md-3,ui-md-3">
                <h:panelGroup>
                    <h:outputLink rendered="#{cryptoTokenMBean.paramRef eq 'default'}"
                                  value="cryptotokens.xhtml">
                        <h:outputText value="#{web.text.CRYPTOTOKEN_NAV_BACK}"/>
                    </h:outputLink>
                    <h:outputLink rendered="#{cryptoTokenMBean.paramRef eq 'caactivation'}"
                                  value="../ca/caactivation.xhtml">
                        <h:outputText value="#{web.text.CRYPTOTOKEN_NAV_BACK_ACT}"/>
                    </h:outputLink>
                    <h:commandLink rendered="#{cryptoTokenMBean.paramRef eq 'initpki'}"
                                   value="#{web.text.CRYPTOTOKEN_NAV_BACK_INIT}" action="#{cryptoTokenMBean.actionBackToPkiInstallation}">
                    </h:commandLink>
                </h:panelGroup>

                <h:panelGroup id="placeholder1"/>

                <!-- Crypto Token ID -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoTokenId != 0}">
                    <p:column>
                        <h:outputLabel for="currentCryptoTokenId" value="#{web.text.CRYPTOTOKEN_ID}"/>
                    </p:column>
                    <p:column>
                        <h:outputText id="currentCryptoTokenId" value="#{cryptoTokenMBean.currentCryptoTokenId}"/>
                    </p:column>
                </p:row>

                <!-- Crypto Token Name -->
                <p:row>
                    <p:column>
                        <h:outputLabel for="currentCryptoTokenName" value="#{web.text.NAME}"/>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenName">
                            <h:inputText value="#{cryptoTokenMBean.currentCryptoToken.name}"
                                         rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode}"
                                         size="45" title="#{web.text.FORMAT_ID_STR}"
                                         id="currentCryptoTokenNameText"/>
                            <h:outputText value="#{cryptoTokenMBean.currentCryptoToken.name}"
                                          rendered="#{!cryptoTokenMBean.currentCryptoTokenEditMode}"/>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- Crypto Token Type -->
                <p:row>
                    <p:column>
                        <h:outputLabel for="currentCryptoTokenType" value="#{web.text.CRYPTOTOKEN_TYPE}"/>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenType">
                            <h:panelGroup
                                    rendered="#{cryptoTokenMBean.currentCryptoTokenId == 0}">
                                <h:selectOneMenu id="selectOneMenuType"
                                                 value="#{cryptoTokenMBean.currentCryptoToken.type}"
                                                 onchange="document.getElementById('currentCryptoTokenForm:selectCryptoTokenType').click();">
                                    <f:selectItems
                                            value="#{cryptoTokenMBean.availableCryptoTokenTypes}"/>
                                </h:selectOneMenu>
                                <h:commandButton id="selectCryptoTokenType"
                                                 action="#{cryptoTokenMBean.selectCryptoTokenType}" value="Update"/>
                                <script>
                                    document
                                        .getElementById('currentCryptoTokenForm:selectCryptoTokenType').style.display = 'none';
                                </script>
                            </h:panelGroup>
                            <h:outputText value="#{cryptoTokenMBean.currentCryptoToken.type}"
                                          rendered="#{cryptoTokenMBean.currentCryptoTokenId != 0}"/>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- Crypto Token Used -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoTokenId!=0}">
                    <p:column>
                        <h:outputLabel for="currentCryptoTokenReferenced" value="#{web.text.CRYPTOTOKEN_REFDHEAD}"/>
                    </p:column>
                    <p:column>
                        <p:selectBooleanCheckbox id="currentCryptoTokenReferenced" value="#{cryptoTokenMBean.currentCryptoToken.referenced}" disabled="true"/>
                    </p:column>
                </p:row>

                <!-- Crypto Token Used -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoTokenId!=0}">
                    <p:column>
                        <h:outputLabel for="currentCryptoTokenActive" value="#{web.text.CRYPTOTOKEN_ACTIVE}"/>
                    </p:column>
                    <p:column>
                        <p:selectBooleanCheckbox id="currentCryptoTokenActive" value="#{cryptoTokenMBean.currentCryptoToken.active}" disabled="true"/>
                    </p:column>
                </p:row>

                <!-- Securosys Authentication Type - this hides and shows the dependent controls below -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoToken.showSecurosysCryptoToken}">
                    <p:column>
                        <h:panelGroup>
                            <h:outputLabel for="currentCryptoTokenSecurosysAuthenticationType" value="#{web.text.CRYPTOTOKEN_SECUROSYS_AUTH} "/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysAuthenticationTypePanelGroup">
                            <h:selectOneMenu
                                    value="#{cryptoTokenMBean.currentCryptoToken.securosysAuthenticationType}"
                                    rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode}"
                                    disabled="#{!cryptoTokenMBean.allowedToModify}">
                                <f:selectItem
                                        itemValue="TOKEN"
                                        itemLabel="Cloud HSM Bearer Token"/>
                                <f:selectItem
                                        itemValue="CERT"
                                        itemLabel="Cloud HSM mTLS certificate"/>
                                <f:ajax render="currentCryptoTokenForm:currentCryptoTokenSecurosysBearerSecret1LabelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysBearerSecret1ValueGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysBearerSecret2LabelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysBearerSecret2ValueGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysAuthKeySecret1LabelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysAuthKeySecret1ValueGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysAuthKeySecret2LabelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysAuthKeySecret2ValueGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysRestApiPanelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysRestApiValuePanelVGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysAuthCertPanelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysAuthCertValuesPanelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysManagementKeyPanelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysManagementKeyValuesPanelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysOperationKeyPanelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysOperationKeyValuesPanelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysServiceKeyPanelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysServiceKeyValuesPanelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysApprovalTimeoutPanelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysApprovalTimeoutValuesPanelGroup
										currentCryptoTokenForm:currentCryptoTokenSecurosysAuthKeySecret1Label
										currentCryptoTokenForm:currentCryptoTokenSecurosysAuthKeySecret1
										currentCryptoTokenForm:currentCryptoTokenSecurosysAuthKeySecret2Label
										currentCryptoTokenForm:currentCryptoTokenSecurosysAuthKeySecret2
										currentCryptoTokenForm:currentCryptoTokenSecurosysBearerSecret1Label
										currentCryptoTokenForm:currentCryptoTokenSecurosysBearerSecret1
										currentCryptoTokenForm:currentCryptoTokenSecurosysBearerSecret2Label
										currentCryptoTokenForm:currentCryptoTokenSecurosysBearerSecret2"/>
                            </h:selectOneMenu>
                            <h:outputText
                                    value="#{cryptoTokenMBean.localize(cryptoTokenMBean.currentCryptoToken.securosysAuthenticationType)}"
                                    rendered="#{not cryptoTokenMBean.currentCryptoTokenEditMode}"/>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- Rest API - Securosys only -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoToken.showSecurosysCryptoToken}">
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysRestApiPanelGroup">
                            <h:outputLabel id="currentCryptoTokenSecurosysRestApiLabel"
                                           for="currentCryptoTokenSecurosysRestApiValuePanelVGroup"
                                           value="#{web.text.CRYPTOTOKEN_SECUROSYS_REST_API} "/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysRestApiValuePanelVGroup">
                            <h:inputText
                                    value="#{cryptoTokenMBean.currentCryptoToken.securosysRestApi}"
                                    rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode}"
                                    disabled="#{!cryptoTokenMBean.allowedToModify}"/>
                            <h:outputText
                                    value="#{cryptoTokenMBean.currentCryptoToken.securosysRestApi}"
                                    rendered="#{!cryptoTokenMBean.currentCryptoTokenEditMode}"/>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- Secret Token -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode and cryptoTokenMBean.currentCryptoToken.requiresSecret and cryptoTokenMBean.currentCryptoToken.showBearerToken}">
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysBearerSecret1LabelGroup">
                            <h:outputLabel id="currentCryptoTokenSecurosysBearerSecret1Label" for="currentCryptoTokenSecurosysBearerSecret1" value="#{web.text.CRYPTOTOKEN_SECUROSYS_BEARER_TOKEN}"/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysBearerSecret1ValueGroup">
                            <h:inputSecret id="currentCryptoTokenSecurosysBearerSecret1" value="#{cryptoTokenMBean.currentCryptoToken.secret1}" size="20" title="#{web.text.CRYPTOTOKEN_SECUROSYS_BEARER_TOKEN}">
                                <f:passThroughAttribute name="autocomplete" value="new-password"/>
                            </h:inputSecret>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- Secret Token2 -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode and cryptoTokenMBean.currentCryptoToken.requiresSecret and cryptoTokenMBean.currentCryptoToken.showBearerToken}">
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysBearerSecret2LabelGroup">
                            <h:outputLabel for="currentCryptoTokenSecurosysBearerSecret2" id="currentCryptoTokenSecurosysBearerSecret2Label" value="#{web.text.CRYPTOTOKEN_SECUROSYS_BEARER_TOKEN_REPEAT}"/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysBearerSecret2ValueGroup">
                            <h:inputSecret id="currentCryptoTokenSecurosysBearerSecret2" value="#{cryptoTokenMBean.currentCryptoToken.secret2}" size="20" title="#{web.text.CRYPTOTOKEN_SECUROSYS_BEARER_TOKEN}">
                                <f:passThroughAttribute name="autocomplete" value="new-password"/>
                            </h:inputSecret>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- Secret Key -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode and cryptoTokenMBean.currentCryptoToken.requiresSecret and cryptoTokenMBean.currentCryptoToken.showKey}">
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysAuthKeySecret1LabelGroup">
                            <h:outputLabel id="currentCryptoTokenSecurosysAuthKeySecret1Label" for="currentCryptoTokenSecurosysAuthKeySecret1" value="#{web.text.CRYPTOTOKEN_SECUROSYS_MTLS_KEY}"/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysAuthKeySecret1ValueGroup">
                            <h:inputSecret id="currentCryptoTokenSecurosysAuthKeySecret1" value="#{cryptoTokenMBean.currentCryptoToken.secret1}" size="20" title="#{web.text.CRYPTOTOKEN_SECUROSYS_MTLS_KEY}">
                                <f:passThroughAttribute name="autocomplete" value="new-password"/>
                            </h:inputSecret>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- Secret Key2 -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode and cryptoTokenMBean.currentCryptoToken.requiresSecret and cryptoTokenMBean.currentCryptoToken.showKey}">
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysAuthKeySecret2LabelGroup">
                            <h:outputLabel for="currentCryptoTokenSecurosysAuthKeySecret2" id="currentCryptoTokenSecurosysAuthKeySecret2Label" value="#{web.text.CRYPTOTOKEN_SECUROSYS_MTLS_KEY_REPEAT}"/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysAuthKeySecret2ValueGroup">
                            <h:inputSecret id="currentCryptoTokenSecurosysAuthKeySecret2" value="#{cryptoTokenMBean.currentCryptoToken.secret2}" size="20" title="#{web.text.CRYPTOTOKEN_SECUROSYS_MTLS_KEY}">
                                <f:passThroughAttribute name="autocomplete" value="new-password"/>
                            </h:inputSecret>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- mTLS Certificate - Securosys only and not shown when using TOKEN -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoToken.showSecurosysCryptoToken}">
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysAuthCertPanelGroup" rendered="#{cryptoTokenMBean.currentCryptoToken.showCert and cryptoTokenMBean.currentCryptoTokenEditMode}">
                            <h:outputLabel id="currentCryptoTokenSecurosysAuthCertLabel" for="currentCryptoTokenSecurosysAuthCert" value="#{web.text.CRYPTOTOKEN_SECUROSYS_MTLS_CERTIFICATE} "/>
                            <h:outputText id="currentCryptoTokenSecurosysAuthCert" value="#{web.ejbcaWebBean.getHelpReference('/Crypto_Tokens_Overview.html')}" escape="false"/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysAuthCertValuesPanelGroup" rendered="#{cryptoTokenMBean.currentCryptoToken.showCert and cryptoTokenMBean.currentCryptoTokenEditMode}">
                            <h:inputText value="#{cryptoTokenMBean.currentCryptoToken.securosysAuthCert}" rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode}" disabled="#{!cryptoTokenMBean.allowedToModify}"/>
                            <h:outputText value="#{cryptoTokenMBean.currentCryptoToken.securosysAuthCert}" rendered="#{!cryptoTokenMBean.currentCryptoTokenEditMode}"/>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- Management Key - Securosys only and not shown when using TOKEN -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoToken.showSecurosysCryptoToken}">
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysManagementKeyPanelGroup" rendered="#{cryptoTokenMBean.currentCryptoToken.showManagementKey and cryptoTokenMBean.currentCryptoTokenEditMode}">
                            <h:outputLabel id="currentCryptoTokenSecurosysManagementKeyLabel" for="currentCryptoTokenSecurosysManagementKeyValuesPanelGroup" value="#{web.text.CRYPTOTOKEN_SECUROSYS_MANAGEMENT_KEY} "/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysManagementKeyValuesPanelGroup" rendered="#{cryptoTokenMBean.currentCryptoToken.showManagementKey and cryptoTokenMBean.currentCryptoTokenEditMode}">
                            <h:inputText value="#{cryptoTokenMBean.currentCryptoToken.securosysManagementKey}" rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode}" disabled="#{!cryptoTokenMBean.allowedToModify}"/>
                            <h:outputText value="#{cryptoTokenMBean.currentCryptoToken.securosysManagementKey}" rendered="#{!cryptoTokenMBean.currentCryptoTokenEditMode}"/>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- Operation Key - Securosys only and not shown when using TOKEN -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoToken.showSecurosysCryptoToken}">
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysOperationKeyPanelGroup" rendered="#{cryptoTokenMBean.currentCryptoToken.showOperationKey and cryptoTokenMBean.currentCryptoTokenEditMode}">
                            <h:outputLabel id="currentCryptoTokenSecurosysOperationKeyLabel" for="currentCryptoTokenSecurosysOperationKeyValuesPanelGroup" value="#{web.text.CRYPTOTOKEN_SECUROSYS_OPERATION_KEY} "/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysOperationKeyValuesPanelGroup" rendered="#{cryptoTokenMBean.currentCryptoToken.showOperationKey and cryptoTokenMBean.currentCryptoTokenEditMode}">
                            <h:inputText value="#{cryptoTokenMBean.currentCryptoToken.securosysOperationKey}" rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode}" disabled="#{!cryptoTokenMBean.allowedToModify}"/>
                            <h:outputText value="#{cryptoTokenMBean.currentCryptoToken.securosysOperationKey}" rendered="#{!cryptoTokenMBean.currentCryptoTokenEditMode}"/>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- Service Key - Securosys only and not shown when using TOKEN -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoToken.showSecurosysCryptoToken}">
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysServiceKeyPanelGroup" rendered="#{cryptoTokenMBean.currentCryptoToken.showServiceKey and cryptoTokenMBean.currentCryptoTokenEditMode}">
                            <h:outputLabel id="currentCryptoTokenSecurosysServiceKeyLabel" for="currentCryptoTokenSecurosysServiceKeyValuesPanelGroup" value="#{web.text.CRYPTOTOKEN_SECUROSYS_SERVICE_KEY} "/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysServiceKeyValuesPanelGroup" rendered="#{cryptoTokenMBean.currentCryptoToken.showServiceKey and cryptoTokenMBean.currentCryptoTokenEditMode}">
                            <h:inputText value="#{cryptoTokenMBean.currentCryptoToken.securosysServiceKey}" rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode}" disabled="#{!cryptoTokenMBean.allowedToModify}"/>
                            <h:outputText value="#{cryptoTokenMBean.currentCryptoToken.securosysServiceKey}" rendered="#{!cryptoTokenMBean.currentCryptoTokenEditMode}"/>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- Approval Timeout - Securosys only -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoToken.showSecurosysCryptoToken}">
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysApprovalTimeoutPanelGroup" rendered="#{cryptoTokenMBean.currentCryptoToken.showApprovalTimeout and cryptoTokenMBean.currentCryptoTokenEditMode}">
                            <h:outputLabel id="currentCryptoTokenSecurosysApprovalTimeoutLabel" for="currentCryptoTokenSecurosysApprovalTimeoutValuesPanelGroup" value="#{web.text.CRYPTOTOKEN_SECUROSYS_APPROVAL_TIMEOUT} "/>
                            <h:outputText id="currentCryptoTokenSecurosysApprovalTimeout" value="#{web.ejbcaWebBean.getHelpReference('/Crypto_Tokens_Overview.html')}" escape="false"/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenSecurosysApprovalTimeoutValuesPanelGroup" rendered="#{cryptoTokenMBean.currentCryptoToken.showApprovalTimeout and cryptoTokenMBean.currentCryptoTokenEditMode}">
                            <h:inputText value="#{cryptoTokenMBean.currentCryptoToken.securosysApprovalTimeout}" rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode}" disabled="#{!cryptoTokenMBean.allowedToModify}"/>
                            <h:outputText value="#{cryptoTokenMBean.currentCryptoToken.securosysApprovalTimeout}" rendered="#{!cryptoTokenMBean.currentCryptoTokenEditMode}"/>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- Azure - Authentication Type - this hides and shows the dependent controls below -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoToken.showAzureCryptoToken}">
                    <p:column>
                        <h:panelGroup>
                            <h:outputLabel for="currentCryptoTokenAuthenticationType" value="#{web.text.CRYPTOTOKEN_KEYVAULT_AUTH} "/>
                            <h:outputText id="currentCryptoTokenAuthenticationTypeHelp" value="#{web.ejbcaWebBean.getHelpReference('/Crypto_Tokens_Overview.html')}" escape="false"/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenAuthenticationTypePanelGroup">
                            <h:selectOneMenu value="#{cryptoTokenMBean.currentCryptoToken.azureAuthenticationType}" rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode}" disabled="#{!cryptoTokenMBean.allowedToModify}">
                                <f:selectItems value="#{cryptoTokenMBean.currentCryptoToken.azureAuthenticationTypes}" var="azureAuthenticationType" itemValue="#{azureAuthenticationType}" itemLabel="#{cryptoTokenMBean.localize('AZUREAUTHENTICATIONTYPE.' += azureAuthenticationType)}"/>
                                <f:ajax render="currentCryptoTokenForm:currentCryptoTokenSecret1LabelGroup
										currentCryptoTokenForm:currentCryptoTokenSecret1ValueGroup
										currentCryptoTokenForm:currentCryptoTokenSecret2LabelGroup
										currentCryptoTokenForm:currentCryptoTokenSecret2ValueGroup
										currentCryptoTokenForm:currentCryptoTokenKeyVaultClientIDPanelGroup
										currentCryptoTokenForm:currentCryptoTokenKeyVaultClientIDValuePanelVGroup
										currentCryptoTokenForm:currentCryptoTokenKeyVaultKeyBindingPanelGroup
										currentCryptoTokenForm:currentCryptoTokenKeyVaultKeyBindingValuesPanelGroup
										currentCryptoTokenForm:currentCryptoTokenSecret1Label
										currentCryptoTokenForm:currentCryptoTokenSecret1
										currentCryptoTokenForm:currentCryptoTokenSecret2Label
										currentCryptoTokenForm:currentCryptoTokenSecret2"/>
                            </h:selectOneMenu>
                            <h:outputText value="#{cryptoTokenMBean.localize('AZUREAUTHENTICATIONTYPE.' += cryptoTokenMBean.currentCryptoToken.azureAuthenticationType)}" rendered="#{not cryptoTokenMBean.currentCryptoTokenEditMode}"/>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- AWS KMS - AWS Authentication Type - this hides and shows the dependent controls below -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoToken.showAWSKMSCryptoToken}">
                    <p:column>
                        <h:panelGroup>
                            <h:outputLabel for="currentCryptoTokenAwsAuthenticationType" value="#{web.text.CRYPTOTOKEN_AWSKMS_AUTH} "/>
                            <h:outputText id="currentCryptoTokenAwsAuthenticationTypeHelp" value="#{web.ejbcaWebBean.getHelpReference('/Crypto_Tokens_Overview.html')}" escape="false"/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenAwsAuthenticationTypePanelGroup">
                            <h:selectOneMenu value="#{cryptoTokenMBean.currentCryptoToken.awsKmsAuthenticationType}" rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode}" disabled="#{!cryptoTokenMBean.allowedToModify}">
                                <f:selectItems value="#{cryptoTokenMBean.currentCryptoToken.awsKmsAuthenticationTypes}" var="awsKmsAuthenticationType" itemValue="#{awsKmsAuthenticationType}" itemLabel="#{cryptoTokenMBean.localize('AWSKMSAUTHENTICATIONTYPE.' += awsKmsAuthenticationType)}"/>
                                <f:ajax render="currentCryptoTokenForm:currentCryptoTokenSecret1LabelGroup
										currentCryptoTokenForm:currentCryptoTokenSecret1ValueGroup
										currentCryptoTokenForm:currentCryptoTokenSecret2LabelGroup
										currentCryptoTokenForm:currentCryptoTokenSecret2ValueGroup
										currentCryptoTokenForm:currentCryptoTokenAWSKMSAccessKeyIDPanelGroup
										currentCryptoTokenForm:currentCryptoTokenAWSKMSAccessKeyIDValuePanelGroup
										currentCryptoTokenForm:currentCryptoTokenSecret1Label
										currentCryptoTokenForm:currentCryptoTokenSecret1
										currentCryptoTokenForm:currentCryptoTokenSecret2Label
										currentCryptoTokenForm:currentCryptoTokenSecret2"/>
                            </h:selectOneMenu>
                            <h:outputText value="#{cryptoTokenMBean.localize('AWSKMSAUTHENTICATIONTYPE.' += cryptoTokenMBean.currentCryptoToken.awsKmsAuthenticationType)}" rendered="#{not cryptoTokenMBean.currentCryptoTokenEditMode}"/>
                        </h:panelGroup>
                    </p:column>
                </p:row>

                <!-- Azure - Client ID - Azure only and not shown when using Managed Identity -->
                <p:row rendered="#{cryptoTokenMBean.currentCryptoToken.showAzureCryptoToken}">
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenKeyVaultClientIDPanelGroup" rendered="#{cryptoTokenMBean.currentCryptoToken.showClientId}">
                            <h:outputLabel id="currentCryptoTokenKeyVaultClientIDLabel" for="currentCryptoTokenKeyVaultClientID" value="#{web.text.CRYPTOTOKEN_KEYVAULT_CLIENTID} "/>
                            <h:outputText id="currentCryptoTokenKeyVaultClientID" value="#{web.ejbcaWebBean.getHelpReference('/Crypto_Tokens_Overview.html')}" escape="false"/>
                        </h:panelGroup>
                    </p:column>
                    <p:column>
                        <h:panelGroup id="currentCryptoTokenKeyVaultClientIDValuePanelVGroup" rendered="#{cryptoTokenMBean.currentCryptoToken.showClientId}">

                            </h:panelGroup>

                            "Save" with slot-check if we are creating a new crypto token, will check if slot is already in use by another crypto token.
                            "Confirm Save" without slot-check if we are creating a new crypto token, and need to confirm that we are re-using the same slot.
                            "Save" without slot-check if we are editing an existing new crypto token (currentCryptoTokenId != 0).
                            -->
                        </ui:remove>
                        <div class="action-buttons">
                            <h:commandButton
                                    action="#{cryptoTokenMBean.saveCurrentCryptoTokenWithCheck}"
                                    value="#{web.text.SAVE}"
                                    rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode and !cryptoTokenMBean.p11SlotUsed and cryptoTokenMBean.currentCryptoTokenId == 0
                            and cryptoTokenMBean.currentCryptoToken.type != 'Pkcs11NgCryptoToken'}"/>
                            <h:commandButton
                                    action="#{cryptoTokenMBean.saveCurrentCryptoToken}"
                                    value="#{web.text.CRYPTOTOKEN_SAVE_CONFIRM}"
                                    rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode and cryptoTokenMBean.p11SlotUsed}"/>
                            <h:commandButton
                                    action="#{cryptoTokenMBean.saveCurrentCryptoToken}"
                                    value="#{web.text.SAVE}"
                                    rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode
                            and (cryptoTokenMBean.currentCryptoTokenId != 0 or cryptoTokenMBean.currentCryptoToken.type == 'Pkcs11NgCryptoToken')}"/>

                             styleClass="no-summary no-margin margin-top-1-rem"/>

                        <h:outputText value="#{web.text.CRYPTOTOKEN_KPM_ALIAS}"/>

                        <br /><h:outputText value="#{web.text.CRYPTOTOKEN_KEY_COMPOSITE_CLASSIC_KEY}: "/> <h:outputText value="#{keyPairGuiInfo.compositeComponentClassical}"/>

            </h:panelGroup>

            <ui:fragment rendered="#{cryptoTokenMBean.keyPairGuiListEmpty &amp;&amp; !cryptoTokenMBean.keyPairGuiListFailed}">
                <p:staticMessage severity="info" detail="#{web.text.CRYPTOTOKEN_KPM_NOPAIRS}"

            </ui:fragment>

            <h:panelGrid columns="3" rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode}" styleClass="no-padding">
                <h:commandButton id="removeSelected" value="#{web.text.CRYPTOTOKEN_KPM_REMOVESEL}"
                                 action="#{cryptoTokenMBean.prepareDeleteKey(cryptoTokenMBean.selectedKeyPairs)}"
                                 rendered="#{!cryptoTokenMBean.keyPairGuiListEmpty &amp;&amp; cryptoTokenMBean.allowedToKeyRemoval}"/>
                <h:panelGroup
                        rendered="#{!cryptoTokenMBean.keyPairGuiListEmpty &amp;&amp; cryptoTokenMBean.allowedToKeyRemoval}"/>
                <h:panelGroup
                        rendered="#{!cryptoTokenMBean.keyPairGuiListEmpty &amp;&amp; cryptoTokenMBean.allowedToKeyRemoval}"/>
            </h:panelGrid>

            <ui:fragment rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode}">
                <h3 class="padding-bottom-1-rem padding-top-1-rem">
                    <h:outputText value="#{web.text.CRYPTOTOKEN_KPM_GENNEW}"/>
                </h3>
            </ui:fragment>

            <h:panelGrid columns="3" rendered="#{cryptoTokenMBean.currentCryptoTokenEditMode}" styleClass="no-left-padding-1st-column">

                <h:inputText id="genNewKeyPairAlias" value="#{cryptoTokenMBean.newKeyPairAlias}"
                             rendered="#{cryptoTokenMBean.allowedToKeyGeneration}" size="30"
                             title="#{web.text.FORMAT_ALIAS}">
                    <f:validator validatorId="legalCharsValidator"/>
                </h:inputText>
                <h:selectOneMenu id="genNewKeyPairSpec" value="#{cryptoTokenMBean.newKeyPairSpec}"
                                 rendered="#{cryptoTokenMBean.allowedToKeyGeneration}"
                                 onchange="addOrRemoveCompositeSuffix()">
                    <f:selectItems value="#{cryptoTokenMBean.availableKeySpecs}"/>
                </h:selectOneMenu>
                <h:selectOneMenu id="genNewKeyPairUsage" value="#{cryptoTokenMBean.keyUsage}"
                                 disabled="#{!cryptoTokenMBean.currentCryptoToken.canGenerateKey}"
                                 rendered="#{cryptoTokenMBean.allowedToKeyGeneration and cryptoTokenMBean.currentCryptoToken.showP11NGCryptoToken}">
                    <f:selectItems value="#{cryptoTokenMBean.availableKeyUsages}"/>
                </h:selectOneMenu>
                <h:commandButton id="genNewKeyPairButton" value="#{web.text.CRYPTOTOKEN_KPM_GENERATE}"
                                 action="#{cryptoTokenMBean.generateNewKeyPair}"
                                 disabled="#{!cryptoTokenMBean.currentCryptoToken.canGenerateKey}"
                                 rendered="#{cryptoTokenMBean.allowedToKeyGeneration}"/>
                <h:panelGroup
                        rendered="#{!cryptoTokenMBean.currentCryptoToken.canGenerateKey}"/>
                <h:panelGroup
                        rendered="#{!cryptoTokenMBean.currentCryptoToken.canGenerateKey}"/>
                <h:outputText
                        value="#{cryptoTokenMBean.currentCryptoToken.canGenerateKeyMsg}"
                        rendered="#{!cryptoTokenMBean.currentCryptoToken.canGenerateKey}"/>
            </h:panelGrid>

        </h:form>
        <script>
            function addOrRemoveCompositeSuffix() {
                var aliasBox = document.getElementById('currentCryptoTokenAliasesForm:genNewKeyPairAlias');
                var alias = aliasBox.value;
                if (alias === '') {
                    return;
                }
                var hasSuffix = /-COMPOSITE[0-9A-Z]*$/.test(alias);
                var keyspec = document.getElementById('currentCryptoTokenAliasesForm:genNewKeyPairSpec').value;
                var shouldHaveSuffix = /MLDSA[0-9]+-/.test(keyspec);
                if (hasSuffix != shouldHaveSuffix) {
                    if (shouldHaveSuffix) {
                        // If a key sequence might possibly be present (there's no way to know for sure whether the
                        // key alias ends with a key sequence), let the user manually put the "-COMPOSITE" suffix
                        // in the correct place.
                        // (Note that it is uncommon to manually create a key with a key sequence, it is mainly
                        // added automatically on rekey)
                        if (!/.[0-9A-Z]{5,5}$/.test(alias)) {
                            aliasBox.value = alias + '-COMPOSITE';
                        }
                    } else {
                        aliasBox.value = alias.replace(/-COMPOSITE([0-9A-Z]*)$/, '$1');
                    }
                }
            }
        </script>
