<ui:composition template="/WEB-INF/include/template.xhtml">
	<ui:param name="resourceBean" value="#{cryptoTokenMBean}"/>
	<ui:define name="content">
		<h1>
			<h:outputText value="#{web.text.CRYPTOTOKEN} : #{cryptoTokenMBean.selectedCryptoTokenName}" />
		</h1>
		<h:form>
			<h:panelGroup rendered="#{cryptoTokenMBean.allowedToKeyRemoval}">
				<h3>
					<h:outputText value="#{web.text.DELETE}"/>
				</h3>
				<h:panelGrid columns="2">
					<h:outputLabel for="deletedCryptoTokenKeyAlias" value="#{web.text.CRYPTOTOKEN_KPM_ALIAS}:"/>
					<h:outputText id="deletedCryptoTokenKeyAlias" value="#{fn:join(cryptoTokenMBean.selectedCryptoTokenKeyAlias, ', ')}"/>
					<h:panelGroup/>
					<h:panelGroup>
						<h:commandButton id="deleteCryptoTokenKeySaveButton" name="deleteCryptoTokenKeySaveButton" style="margin-right:10px;"
										 action="#{cryptoTokenMBean.removeKeyPairs}" value="#{web.text.DELETE_CONFIRM}"/>
						<h:commandButton id="deleteCryptoTokenKeyCancelButton" name="deleteCryptoTokenKeyCancelButton"
										 value="#{web.text.CANCEL}" immediate="true"
										 action="#{cryptoTokenMBean.editCryptoToken(cryptoTokenMBean.currentCryptoTokenId)}"/>
					</h:panelGroup>
				</h:panelGrid>
			</h:panelGroup>
		</h:form>
	</ui:define>
</ui:composition>
</html>
