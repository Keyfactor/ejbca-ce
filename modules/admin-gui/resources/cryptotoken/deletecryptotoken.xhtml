<ui:composition template="/WEB-INF/include/template.xhtml">
	<ui:param name="resourceBean" value="#{cryptoTokenMBean}"/>
	<ui:define name="content">
		<h1>
			<h:outputText value="#{web.text.MANAGECRYPTOTOKENS}"/>
		</h1>
		<h:form>
			<h:panelGroup rendered="#{cryptoTokenMBean.allowedToDelete}">
				<h3>
					<h:outputText value="#{web.text.DELETE}"/>
				</h3>
				<h:panelGrid columns="2">
					<h:outputLabel for="deletedCryptoTokenName" value="#{web.text.NAME}:"/>
					<h:outputText id="deletedCryptoTokenName" value="#{cryptoTokenMBean.selectedCryptoTokenName}"/>
					<h:panelGroup/>
					<h:panelGroup>
						<h:commandButton id="deletedCryptoTokenSaveButton" name="deletedCryptoTokenSaveButton" style="margin-right:10px;"
										 action="#{cryptoTokenMBean.deleteCryptoToken}" value="#{web.text.DELETE_CONFIRM}">
							<f:param name="cryptoTokenId" value="#{cryptoTokenMBean.selectedCryptoTokenId}"/>
						</h:commandButton>
						<h:commandButton id="deleteCryptoTokenCancelButton" name="deleteCryptoTokenCancelButton"
										 action="cryptotokens?faces-redirect=true" value="#{web.text.CANCEL}" immediate="true" />
					</h:panelGroup>
				</h:panelGrid>
			</h:panelGroup>
		</h:form>
	</ui:define>
</ui:composition>
