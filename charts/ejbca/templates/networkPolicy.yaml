{{- if .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ejbca.fullname" . }}-network-policy
spec:
  podSelector:
    matchLabels:
      {{- include "ejbca.selectorLabels" . | nindent 6 }}
  {{- toYaml .Values.networkPolicy | nindent 2 }}
{{- end }}  