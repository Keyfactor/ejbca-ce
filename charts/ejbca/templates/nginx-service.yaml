# Configuration for NGINX meant for 
# ClusterIP -> cluster internal communication
# LoadBalancer -> external access
{{- if .Values.nginx.enabled }}
kind: Service
apiVersion: v1
metadata:
  name: {{ include "ejbca.fullname" . }}-nginx
  {{- with .Values.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    {{- if .Values.nginx.service.httpPort }}
    - name: nginx-http
      port: {{ .Values.nginx.service.httpPort }}
      {{- if eq .Values.nginx.service.type "NodePort" }}
      nodePort: {{ .Values.nginx.service.httpPort }}
      {{- end }}
      targetPort: nginx-http
      protocol: TCP
    {{- end }}
    - name: nginx-https
      port: {{ .Values.nginx.service.httpsPort }}
      {{- if eq .Values.nginx.service.type "NodePort" }}
      nodePort: {{ .Values.nginx.service.httpsPort }}
      {{- end }}
      targetPort: nginx-https
      protocol: TCP
  selector:
    {{- include "ejbca.selectorLabels" . | nindent 4 }}
{{- end }}
---
# Conditional Client IP based sticky session - use case: UI Access 
{{- if ne (int .Values.replicaCount) 1 }}
{{- if and .Values.nginx.enabled .Values.nginx.loadBalancerAccess.enableStickySessionClientIp }}
kind: Service
apiVersion: v1
metadata:
  name: {{ include "ejbca.fullname" . }}-nginx-sticky-session-client-ip
  {{- with .Values.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: "LoadBalancer"
  sessionAffinity: "ClientIP"
  ports:
    {{- if .Values.nginx.service.httpPort }}
    - name: nginx-http
      port: {{ .Values.nginx.service.httpPort }}
      targetPort: nginx-http
      protocol: TCP
    {{- end }}
    - name: nginx-https
      port: {{ .Values.nginx.service.httpsPort }}
      targetPort: nginx-https
      protocol: TCP
  selector:
    {{- include "ejbca.selectorLabels" . | nindent 4 }}
{{- end }}
{{- end }}
---
# Conditional Pod index based access - use case: Peering, UI Access or Manually selecting Closer Instance
{{- if or (ne (int .Values.replicaCount) 1) (.Values.autoscaling.enabled) }}
{{- if and .Values.nginx.enabled }}
{{- range $i := until (int (include "ejbca.maxReplicaCount" .)) }}
kind: Service
apiVersion: v1
metadata:
  name: {{ include "ejbca.fullname" $ }}-nginx-per-pod-{{ . }}
  {{- with $.Values.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $.Values.nginx.loadBalancerAccess.enableReplicaSpecificAccess }}
  type: "LoadBalancer"
  {{- else }}
  type: "ClusterIP"
  {{- end }}
  ports:
    {{- if $.Values.nginx.service.httpPort }}
    - name: nginx-http
      port: {{ $.Values.nginx.service.httpPort }}
      targetPort: nginx-http
      protocol: TCP
    {{- end }}
    - name: nginx-https
      port: {{ $.Values.nginx.service.httpsPort }}
      targetPort: nginx-https
      protocol: TCP
  selector:
    {{- include "ejbca.selectorLabels" $ | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ include "ejbca.fullname" $ }}-{{ . }}
---
{{- end }}
{{- end }}
{{- end }}

